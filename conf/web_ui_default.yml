# Web UI reference configuration - modular page/bloc schema
# (see doc/web_ui_modular.md section 2)
#
# Served by default when the web server configuration does not provide the
# ui_config key (see navigation_server/web_server/ui_config.py).
# Schema: three global sections - widgets, block_types, pages.
#
# Concepts (doc/web_ui_modular.md section 1):
#   page = set of blocks; block = entity + views; view = information +
#   representation (widget). Each entity is served by its dedicated service
#   through the standard datasets (parameters / data / trend).

version: 2

# Color palette: referenced by name in the widgets (doc section 5.8)
colors:
  voltage: "#0000ff"
  auxiliary_voltage: "#55aaff"
  power: "#ff9900"
  current: "#ff00ff"
  state_of_charge: "#ffff00"
  energy: "#9900ff"

# --- Widgets (global) -----------------------------------------------------
# Parameterized elementary views, built on the hard-coded base widgets
# (doc section 5.4): positive_viewgraph, symmetric_viewgraph,
# single_positive_curve, single_symmetric_curve, communication_indicator.
#
# scale (doc section 5.7): {type: fixed|dual|dynamic, max|low|high}
# ratio_percent: protobuf ratio 0-1 displayed as percent (doc section 4)

widgets:
  - id: voltage_viewgraph
    base_widget: positive_viewgraph
    unit: V
    precision: 2
    color: voltage
    scale: {type: fixed, max: parameters/max_voltage_scale}

  - id: auxiliary_voltage_viewgraph
    base_widget: positive_viewgraph
    unit: V
    precision: 2
    color: auxiliary_voltage
    scale: {type: fixed, max: parameters/max_voltage_scale}

  - id: production_viewgraph
    base_widget: positive_viewgraph
    unit: W
    precision: 0
    color: power
    scale:
      type: dual
      low: parameters/total_power_low
      high: parameters/total_power_high

  - id: power_balance
    base_widget: symmetric_viewgraph
    unit: W
    precision: 0
    color: power
    scale:
      type: dual
      low: parameters/total_power_low
      high: parameters/total_power_high

  - id: power_balance_trend
    base_widget: single_symmetric_curve
    scale: {type: dynamic}

  - id: state_of_charge_viewgraph
    base_widget: positive_viewgraph
    unit: "%"
    precision: 1
    color: state_of_charge
    ratio_percent: true          # ratio 0-1 in the dataset, displayed 0-100
    scale: {type: fixed, max: 100}

  - id: energy_stock_viewgraph
    base_widget: positive_viewgraph
    unit: Wh
    precision: 0
    color: energy
    scale: {type: fixed, max: parameters/total_energy_capacity}

  - id: production_current_viewgraph
    base_widget: positive_viewgraph
    unit: A
    precision: 1
    color: current
    scale: {type: fixed, max: 50}

  - id: power_trend
    base_widget: single_positive_curve
    scale: {type: dynamic}

# --- Block types (global) -------------------------------------------------
# Reusable block definitions: title (data path or literal), optional
# top_widget, list of views (data paths always carry the dataset explicitly).

block_types:
  # Generic source view - field names of MPPT_Data (current, power)
  - id: energy_source
    title: parameters/label
    top_widget: device_state_indicator
    definition:
      - view: current
        title: Current
        data: data/current
        widget: production_current_viewgraph
      - view: power
        title: Power
        data: data/power
        widget: production_viewgraph
      - view: power_trend
        title: Power trend
        data: trend/power
        widget: power_trend

  # DC-DC charger source view - field names of DC_DC_Data (the production
  # side is the output: output_current, output_power)
  - id: dc_dc_source
    title: parameters/label
    top_widget: device_state_indicator
    definition:
      - view: current
        title: Current
        data: data/output_current
        widget: production_current_viewgraph
      - view: power
        title: Power
        data: data/output_power
        widget: production_viewgraph
      - view: power_trend
        title: Power trend
        data: trend/output_power
        widget: power_trend

# --- Pages -----------------------------------------------------------------
# Page 0 'services' is built-in and not optional (doc section 1, rule 1).

pages:
  - id: services
    title_i18n: nav.services
    builtin: services
    optional: false

  - id: ems
    title_i18n: nav.ems
    layout: {columns: 2}
    refresh_interval: 10000          # ms
    availability_endpoint: /api/energy_available
    parameters_endpoint: /api/energy/0/parameters
    blocks:
      - id: energy_summary
        title: Energy Controller
        priority: 1
        position: {row: 0, column: 0}
        width: 2                    # 2 columns (default 1)
        endpoint: /api/energy/0/data
        definition:
          - view: main_voltage
            title: Main Voltage
            data: data/main_voltage
            widget: voltage_viewgraph
          - view: auxiliary_voltage
            title: Auxiliary Voltage
            data: data/auxiliary_voltage
            widget: auxiliary_voltage_viewgraph
          - view: production_power
            title: Production
            data: data/production_power
            widget: production_viewgraph
          - view: consumption_power
            data: data/consumption_power
            widget: production_viewgraph
          - view: battery_power_balance
            title: Battery power
            data: data/battery_balance
            widget: power_balance
          - view: state_of_charge
            title: State of charge
            data: data/state_of_charge
            widget: state_of_charge_viewgraph
          - view: energy_stock
            title: Energy stock
            data: data/energy_stock
            widget: energy_stock_viewgraph
          - view: power_balance_trend
            title: Battery balance trend
            data: trend/battery_balance
            widget: power_balance_trend

      - id: energy-sources
        type: energy_source
        priority: 2
        repeat:
          source_endpoint: /api/energy/0/parameters/sources
          block_endpoint: /api/{service}/{instance}
          # Per-service block type: heterogeneous entities do not expose the
          # same dataset field names (doc section 2.5)
          types:
            mppt: energy_source
            dc_dc: dc_dc_source
