function: Log replay server to CAN
server_name: LogReplayServer
log_level: INFO
trace_dir: /data/navigation/traces
debug_configuration: false
decode_definition_only: false
connect_agent: false
secure_grpc: false

log_module:
    router_common.agent_interface: DEBUG


features:
  - router_core
  - nmea2000
  - nmea2000_devices
  - can_interface
  - log_replay

servers:

- Main:
    class: NavigationMainServer

- gRPCMainServer:
      class: GrpcServer
      port: 4502

couplers:

- LogReader:
    logfile: /mnt/meaban/Bateau/traces_ref/TRACE-CAN-if-can0-240823-1304.log
    class: RawLogCoupler
    autostart: true
    direction: read_only
    stop_system: true

services:

- Console:
   class: Console
   server: gRPCMainServer

publishers:

- Forwarder:
    class: N2KForwarderToServer
    address: 192.168.1.23
    port: 4512
    device: LogInjector
    queue_size: 60
    couplers: [LogReader]

applications:


