function: Log replay server to CAN
server_name: LogReplayServer
log_level: INFO
trace_dir: /data/navigation/traces
debug_configuration: false
decode_definition_only: false
connect_agent: false
secure_grpc: false

log_module:
    router_common.agent_interface: ERROR


features:
  - router_core
  - nmea2000
  - nmea2000_devices
  - can_interface
  - log_replay

servers:

- Main:
    class: NavigationMainServer

- gRPCMainServer:
      class: GrpcServer
      port: 4502

- NMEANetwork:
      class: NMEA2KActiveController
      trace: false
      channel: can0
      mac_source: eno1
      max_silent: 60.0
      applications: [LogInjector]


couplers:

- LogReader:
    logfile: /mnt/meaban/Bateau/traces_ref/TRACE-CAN-if-can0-240823-1304.log
    class: TransparentCanLogCoupler
    autostart: true
    direction: read_only
    stop_system: true

services:

- Console:
   class: Console
   server: gRPCMainServer
publishers:

- Dispatcher:
    class: N2KSourceDispatcher
    mode: transparent
    couplers: [LogReader]

applications:

- LogInjector:
    class: DeviceReplaySimulator
    source: 255
    publisher: Dispatcher
