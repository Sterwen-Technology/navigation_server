syntax = "proto3";

// Global remark concerning units used in these services
//  Voltage are in Volt, current Ampere
//  Power in Watt, Energy in Watt-hour
//  Time in seconds
//  Date and timestamp are UTC
//  Ratios (e.g. state of charge) are always between 0 and 1 - the conversion
//  to percent (0-100) is the responsibility of the display (web UI), never of
//  the transport.
//
// Each service exposes the three standard datasets (see doc/web_ui_modular_en.md section 7):
//   parameters : static / semi-static data (message <Service>_Parameters)
//   data       : instantaneous values (message <Service>_Data)
//   trend      : immediate history (message <Service>_Trend, values in 'samples')
// Live status fields (state, communication_ok, off_reason...) may be repeated
// in the data dataset to avoid a permanent fetch of the parameters dataset.

// Victron VE direct protocol specific enum

enum VE_Error{
  no_error=0;
  Battery_voltage_too_high=2;
  Charger_Temperature_too_high=17;
  Charger_over_current=18;
  Charger_current_reversed=19;
  Bulk_time_limit_exceeded=20;
  Current_sensor_issue=21;
  Input_voltage_too_high=33;
  Input_current_too_high=34;
}

enum VE_state {
  Off=0;
  Low_power=1; // not used by MPPT
  Fault=2;
  Bulk=3;
  Absorption=4;
  Float=5;
  Storage=6;
  Equalize=7;
  Inverting=9;
  Power_Supply=11;
  Starting_up=245;
  Repeated_absorption=246;
  Auto_equalize=247;
  Battery_Safe=248;
  External_control=252;
}

enum VE_MPPT {
  MPPT_Off=0;
  Limited=1;
  Active=2;
}

enum VE_Off_Reason {
  no_reason=0;
  No_input_power=1;
  Switched_off_switch=2;
  Switched_off_register=4;
  Remote_input=8;
  Protection_active=0x10;
  Paygo=0x20;
  BMS=0x40;
  Engine_shutdown_detection=0x80;
  Analyzing_input_voltage=0x100;
}

// Energy management enums

enum EnergySource {
  Battery=0;      // Default is Battery - useful to have a consistent device typing across all of them
  Solar_MPPT=1;
  Alternator=2;
  AC_Charger=3;
  AC_DC_ChargerConverter=8;
  DC_DC_Charger=4;
  Windmill=5;
  Hydro_generator=6;
  AC_Generator=7;
}

// Global messages

message energy_request {
  uint32 id=1;              // request ID
  uint32 instance=2;        // Optional - In systems with multiple instances of one device
  string command=3;         // Optional - Additional command
  uint32 trend_samples=4;   // Optional -  Max number of samples to be returned
}

message energy_command_response{
  uint32 id=1;    // request ID
  string command=2; // The command that was requested
  string response=3; // Response message
}

// MPPT - Solar panel specific section

// MPPT parameters dataset: semi static information + device parameters
message MPPT_Parameters {
  // Semi static information
  uint32 instance=1;          // device ID - identify the device when more than one are used
  bool communication_ok=2;  // True if the communication is working with the MPPT device
  string device_label=3;
  string  device_model=4;
  VE_Error error = 5;
  VE_state state= 6;
  VE_MPPT mppt_state =7;
  uint32 off_reason=15; // Bitwise OR of the reasons as per VE_Off_Reason
  string product_id = 8;
  string firmware = 9;
  string serial_number = 10;
  float day_max_power = 11;  //Watt
  float day_power = 12;      //kilo Watt-heure
  string msg_timestamp = 13; // ISO UTC
  float panel_max_power=14;    // Watt
  float panel_max_voltage=19;  // Volt
  float max_voltage=16;        // Volt - on MPPT output
  float trend_duration=17;     // Duration in minutes of the trand series
  float trend_interval=18;     // interval in seconds between trend values
}

// that is the minimum set of parameters that are configurable from the service
// Only the parameter that are set in the message are applied
message MPPT_Configuration_parameters {
  uint32 instance=1;
  bool  enabled=2;
  string battery_type=3;
  float bulk_voltage=4;
  float float_voltage=5;
  float equalize_voltage=6;
}

// MPPT data dataset: instantaneous values
message MPPT_Data {
  float current = 1;  // Amp
  float voltage =2;   // Volt
  float panel_voltage=4;  // Volt
  float panel_power =3;  //Watt
  float power=5;    // Watt - that is the output power from the MPPT, the one that really matter
  // The following fields are repeated in the current data to avoid fetching the parameters permanently
  bool communication_ok=6;  // True if the communication is working with the MPPT device
  VE_state state= 8;
  VE_MPPT mppt_state =7;
  uint32 off_reason=9; // Bitwise OR of the reasons as per VE_Off_Reason
}

// MPPT trend dataset
message MPPT_Trend {
  uint32 instance=1;
  uint32 nb_values=2;
  float interval=3;          // seconds between samples
  repeated MPPT_Data samples=4;
}

service MPPTService {
  rpc GetParameters(energy_request) returns (MPPT_Parameters) {}
  rpc GetData(energy_request) returns (MPPT_Data) {}
  rpc GetTrend(energy_request) returns (MPPT_Trend) {}
  rpc SetConfiguration(MPPT_Configuration_parameters) returns (energy_command_response) {}
  rpc DeviceCommand(energy_request) returns (energy_command_response) {}
}

// Battery bank service

message ShuntDevice {
  uint32 instance=1;                // instance ID of the controlling Shunt/Controller
  string product_id = 2;
  string firmware = 3;
  uint32 battery_bank_instance=6;   // instance ID of the controlled battery bank
  string serial = 10;
  VE_Error error =4;
  VE_state state=5;
}

// Battery parameters dataset: static / semi static battery bank information
message Battery_Parameters {
  uint32 instance=1;          // Instance ID=0 by default
  string device_label=3;
  string device_model=4;
  string chemistry=16;
  uint32 controller=17;       // Instance ID of the Shunt
  optional ShuntDevice controller_details=22;  // Details of the controlling shunt, when available
  float nominal_voltage=5;    // Volt
  float nominal_capacity=6;   // Wh
  float max_voltage=10;        // Maximum charge voltage => alarm
  float min_voltage=11;        // Minimum operating voltage => alarm
  float charge_voltage=12;     // Bulk charge
  float max_charge_current=13; // A
  float last_24h_energy=14;   // Wh Positive charge
  float reporting_interval=15; // In seconds
  float trend_duration=18;     // Duration in minutes of the trand series
  float trend_interval=19;     // interval in seconds between trend values
  float high_power_scale_amp=20;    // Scale for data display in high power
  float low_power_scale_amp=21;     // Scale for low power. If current exceed that value => high power
}

// Battery data dataset: instantaneous values
message Battery_Data {
  uint32 instance=1;  // Shunt instance ID
  float voltage = 2;  // Instant voltage
  float current = 3;  // Instant current positive = charge, negative discharge
  float energy_variation = 4; // Wh positive = charge
  float auxiliary_voltage = 5;  // Instant auxiliary voltage - engine battery in most of the cases
  float state_of_charge=6;      // Ratio between 0-1
  // Live status repeated from the controller (see global remark)
  bool communication_ok=7;
}

// Battery trend dataset
message Battery_Trend_Bucket {
  string timestamp=1;  // ISO UTC of the reporting period end
  float voltage=2;     // Voltage at the end of the period
  float energy_variation=3;      // in Wh positive charge - Variation during the interval
  float state_of_charge=4;    // Ratio between 0-1 at the end of the period
  float power=5;          // average power over the period in W
}

message Battery_Trend {
  uint32 instance=1;
  uint32 nb_values=2;   // Number of values in the response
  float interval=3;     // Interval between samples in seconds
  repeated Battery_Trend_Bucket samples=4;
}

service BatteryService {
    rpc GetParameters(energy_request) returns (Battery_Parameters) {}
    rpc GetData(energy_request) returns (Battery_Data) {}
    rpc GetTrend(energy_request) returns (Battery_Trend) {}
    }

// DC-DC Charger

// DC-DC parameters dataset
message DC_DC_Parameters {
  uint32 instance=1;    // instance number default=0, if single instance
  string device_label=2;       // User label
  string device_model=3;       // Device model and make
  float nominal_input_voltage=4;
  float  nominal_output_voltage=5;
  float input_voltage_range=6;
  float output_voltage_range=7;
  float max_power=8; // W
  // Live status fields repeated in the data dataset (see global remark)
  VE_state state=9;
  VE_Error error=10;
  uint32 off_reason=11;     // Bitwise OR of the reasons as per VE_Off_Reason
  bool communication_ok=12;
  float trend_duration=13;     // Duration in minutes of the trand series
  float trend_interval=14;     // interval in seconds between trend values
}

// DC-DC data dataset: instantaneous values
message DC_DC_Data {
  uint32 instance=1;
  VE_state state=2;
  VE_Error error=3;
  VE_Off_Reason off_reason=4;
  bool communication_ok=5;
  float input_voltage=6;  // Current input voltage (V)
  float input_current=7;  // Current input current (A)
  float input_power=8;    // Current input power (W)
  float output_voltage=9;
  float output_current=10;
  float output_power=11;  // W
}

// Configurable parameters
message DC_DC_Charger_configuration {
  uint32 instance=1;
  bool charger_on=2;
  float max_input_current=3;  // in A
  float max_output_current=4; // in A
}

// DC-DC trend dataset
message DC_DC_Trend {
  uint32 instance=1;
  uint32 nb_values=2;
  float interval=3;
  repeated DC_DC_Data samples=4;
}

service DC_DC_Service {
  rpc GetParameters(energy_request) returns (DC_DC_Parameters) {}
  rpc GetData(energy_request) returns (DC_DC_Data) {}
  rpc GetTrend(energy_request) returns (DC_DC_Trend){}
  rpc SetConfiguration(DC_DC_Charger_configuration) returns (energy_command_response) {}
  // Allow to start and stop the charger
  rpc DeviceCommand(energy_request) returns (energy_command_response) {}
}

// Energy Controller
// That service manages the global view and summary view of the electrical energy in the boat
// In that version, only instantaneous values (with trend) are managed. No historical data
// The Energy Controller presents a consolidated view of the energy system: it does NOT
// duplicate the data of the individual entities (batteries, MPPT, DC-DC chargers), which
// are served by their own dedicated service.

message EnergySourceDevice {
  uint32 instance_id = 1;
  string label = 2;
  EnergySource type = 3;
}

message BatteryUnit {
  uint32 instance_id=1;
  string label=2;       //
}

// Energy controller parameters dataset
message EnergyControllerParameters {
  float nominal_main_voltage=1;       // 12-24-48V
  float nominal_auxiliary_voltage=2;
  float maximum_main_voltage=3;       // => alarm
  float minimum_main_voltage=4;       // => alarm
  repeated EnergySourceDevice sources=5;
  repeated BatteryUnit batteries=6;
  float trend_duration=7;     // Duration in minutes of the trand series
  float trend_interval=8;     // interval in seconds between trend values
  float total_energy_capacity=9;  // sum of all batteries capacity in Wh (for display scale)
  float total_power_high=10;    // Total power (ceiling) in high power mode (for display scale)
  float total_power_low=11;     // Total power in low power mode (for display scale)
  float max_voltage_scale=12;   // To build all graphical representation on voltage (except generators specific voltage)
}

// Energy controller data dataset: consolidated instantaneous data
message EnergyControllerData {
  float main_voltage=1;
  float auxiliary_voltage=2;
  float production_power=3;
  float consumption_power=4; // Excluding injected in battery banks
  float energy_stock=5;     // total energy available in all battery banks (Wh)
  float battery_balance=6;  // W positive power injected / negative draw (W)
  float state_of_charge=7;  // Ratio between 0 and 1 - consolidated over all battery banks
}

// Energy controller trend dataset
message EnergyControllerTrend {
  uint32 nb_values=1;   // number of samples
  float interval=2;     // in seconds
  repeated EnergyControllerData samples=3;  // if the interval is over the reporting period then average is reported
}

service EnergyService {
  rpc GetParameters(energy_request) returns (EnergyControllerParameters) {}
  rpc GetData(energy_request) returns (EnergyControllerData) {}
  rpc GetTrend(energy_request) returns (EnergyControllerTrend) {}
}
