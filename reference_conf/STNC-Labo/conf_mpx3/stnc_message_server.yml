function: Messages (NMEA0183 & NMEA2000) server coupler interfaces
server_name: STNC_Message_Server
log_level: INFO
trace_dir: /data/navigation/traces
data_dir: /data/navigation/data
secure_grpc: true
log_module:
  router_core.coupler: INFO
  router_core.publisher: INFO
  router_core.IPCoupler: INFO
  
  

features:
  - router_core
  - nmea2000
  - nmea2000_devices
  - couplers
  - gnss


servers:

- Main:
    class: NavigationMainServer

- NMEAServer:
    class: NMEAServer
    port: 4500
    nmea2000: dyfmt

- NMEASender:
    class: NMEASenderServer
    port: 4503
    nmea2000: dyfmt
    coupler: MiniPlex3

- gRPCMain:
      class: GrpcServer
      port: 4502

- ShipModulConfig:
    class: ShipModulConfig
    port: 4501
    coupler: MiniPlex3
  
- NMEANetwork:
     class: NMEA2KController

couplers:

- GPS:
    class: SerialGPS
    device: /dev/ttyUSB0
    baudrate: 38400
    autostart: false
    trace_messages: true
    talker: GP
    formatters: [RMC, GLL, VTG]
    
- SerialOutput:
    class: NMEASerialPort
    device: /dev/ttyUSB1
    baudrate: 9600
    autostart: true
    
- MiniPlex3:
    class: ShipModulInterface
    address: 172.16.2.48
    port: 10110
    transport: TCP
    nmea2000_controller: NMEANetwork
    protocol: nmea_mix
    autostart: true
    trace_raw: false

- SolarPanel:
    class: MpptCoupler
    port: 4505
    server: NMEAServer
    direction: read_only
    report_timer: 20

    
filters:

- Engine:
    class: NMEA2000Filter
    pgn: [127488, 127489]
    type: select
    
- Position:
    class: NMEA2000Filter
    pgn: [129025, 129026]
    type: select

services:

- Console:
      class: Console
      server: gRPCMain


publishers:

#- SendNMEA2000:
#    class: GrpcPublisher
#    active: true
#    decode_nmea2000: false
#    nmea0183: convert_strict
#    address: 127.0.0.1
#    port: 4508
#    max_retry: 0
#    filters: [Engine]
#    couplers: [CANCoupler]

- GPSInjector:
   class: Injector
   couplers: [GPS]
   target: MiniPlex3


applications:





