function: Local system control agent
server_name: navigation_agent
log_level: INFO
trace_dir: /data/navigation/traces
data_dir: /data/navigation/data
ssl_key_dir: /home/laurent/certificates
log_module:
  network.nmcli_interface: INFO 
  network.network_service: DEBUG
  agent.agent_service: INFO
  router_common.agent_interface: INFO

decode_definition_only: False
secure_grpc: true

features:
    - agent
    - network

servers:

- Main:
      class: AgentTopServer

- gRPCMain:
    class: GrpcServer
    port: 4545
    secure: true

services:

- Agent:
    class: AgentService
    server: gRPCMain

- Network:
    class: NetworkService
    server: gRPCMain
    configuration: network_conf.yml
    generate_ssl: true

processes:

  - STNC_Message_Server:
      class: SystemdProcess
      service: navigation
      autostart: true

  - GNSS:
      class: SystemdProcess
      service: gnss
      autostart: false

  - GNSSConfig:
      class: SystemdProcess
      service: gnss_config
      controlled: false

  - Data:
      class: SystemdProcess
      service: navigation_data
      autostart: false

  - Energy:
      class: SystemdProcess
      service: energy
      autostart: false








