function: Energy management server
server_name: Energy
log_level: INFO
trace_dir: /data/navigation/traces
data_dir: /data/navigation/data
enable_secure_grpc: false
force_secure_grpc: false
connect_agent: true
log_module:
    energy_mgmt.mppt_service: INFO
    energy_mgmt.energy_controller_service: DEBUG
    energy_mgmt.energy_simulator_service: DEBUG
    nmea2000.nmea2k_publisher: INFO
    router_common.grpc_server_service: INFO
    

features:
    - router_core
    - energy_mgmt
    - nmea2000
    - couplers:
          VEDirectCoupler

servers:

- Main:
      class: NavigationMainServer

- gRPCMain:
    class: GrpcServer
    port: 4505

couplers:

- SmartShunt1_VEDirect:
    class: VEDirectCoupler
    device: /dev/ttyUSB1        # RS232 port #1
    # alt_device: /dev/ttyUSB8
    interface: serial
    protocol: non_nmea
    max_attempt: 1

- MPPTVEDirect:
    class: VEDirectCoupler
    device: /dev/ttyUSB4
    alt_device: /dev/ttyUSB8
    interface: serial
    protocol: non_nmea
    max_attempt: 1

- DCDCVEDirect:
    class: VEDirectCoupler
    device: /dev/ttyUSB5
    alt_device: /dev/ttyUSB9
    interface: serial
    protocol: non_nmea
    max_attempt: 1


services:

- MPPTService:
    class: MPPTService
    coupler: MPPTVEDirect
    mode: coupler
    server: gRPCMain
    # publisher: NMEAPush
    protocol: nmea2000
    energy_controller: EnergyController
      # device parameters
    device_label: MPPT1
    device_model: Victron MPPT Blue Solar 70-15
    panel_max_power: 180
    panel_max_voltage: 40
    max_voltage: 15

- MainBattery:
    class: BatteryService
    coupler: SmartShunt1_VEDirect
    server: gRPCMain
    mode: coupler
    energy_controller: EnergyController
    # parameters
    nominal_voltage: 12.8
    nominal_capacity: 12.0
    chemistry: LFP
    max_charge_current: 10.0

- DCDCCharger:
    class: DC_DCService
    coupler: DCDCVEDirect
    server: gRPCMain
    mode: coupler
    energy_controller: EnergyController
    # device parameters
    device_label: DCDC1
    device_model: Victron Orion XS 70
    max_power: 1000


- EnergyController:
    class: EnergyService
    server: gRPCMain
    # all parameters as default

- EnergySimulator:
    class: EnergySimulatorService
    server: gRPCMain
    battery_service: MainBattery
    mppt_services: [MPPTService]
    dc_dc_services: [DCDCCharger]
    energy_controller: EnergyController
    # all other parameters as default

- Console:
    class: Console
    server: gRPCMain

publishers:

# - NMEAPrint:
#       class: N2KTracePublisher
#       active: false
#       flexible_decode: false
#       output: PRINT
#       couplers: [MPPTVEDirect]

- NMEAPush:
    class: N2KForwarderToServer
    active: true
    service: EnergyService
    address: 127.0.0.1
    port: 4512
    device: MPPT








