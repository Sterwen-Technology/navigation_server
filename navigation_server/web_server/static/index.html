            `;
            t.translateAllElements();
            const rRuns = $(`events-runs-${processName}`);
            const rEvents = $(`events-events-${processName}`);
            if (rRuns) rRuns.addEventListener('change', () => setEngineEventsMode(processName, 'runs'));
            if (rEvents) rEvents.addEventListener('change', () => setEngineEventsMode(processName, 'events'));
        }

        async function setEngineEventsMode(processName, mode) {
            const win = focusWindow('engine', processName);
            if (!win) return;
            win.eventsMode = mode;
            const toggleEl = $(`engine-toggle-${processName}`);
            if (toggleEl) toggleEl.classList.toggle('mode-events', mode === 'events');
            const container = $(`engine-events-${processName}`);
            if (container) {
                container.setAttribute('data-mode', mode);
                container.innerHTML = `<div class="empty" data-i18n="general.loading">Loading...</div>`;
                t.translateAllElements();
            }
            // Get engine data from the specific process, using engine_id 0
            const data = await apiGet(`/api/engine/${encodeURIComponent(processName)}/0`);
            if (data.ok) {
                renderEngineEvents(data, processName, mode);
            }
        }

        function renderEngineEvents(data, processName, mode) {
            const container = $(`engine-events-${processName}`);
            if (!container) return;
            if (!data.ok) {
                container.innerHTML = `<div class="empty">${escapeHtml(data.error || "Error")}</div>`;
                t.translateAllElements();
                return;
            }
            let html = '';
            if (mode === 'runs') {
                const runs = data.runs || [];
                if (runs.length === 0) {
                    container.innerHTML = '<div class="empty" data-i18n="engine.no_runs">No runs found.</div>';
                    t.translateAllElements();
                    return;
                }
                const runRows = runs.map(run => `
                    <div class="run-row">
                        <span class="run-date">${new Date(run.start_time).toLocaleString()}</span>
                        <span class="run-date">${run.stop_time ? new Date(run.stop_time).toLocaleString() : "N/A"}</span>
                    <span class="run-duration">${fmt(Math.round(run.duration / 60))}</span>
                        <span class="run-avg">${fmt(run.average_speed)} RPM</span>
                        <span class="run-max">${fmt(run.max_speed)} RPM</span>
                    </div>
                `).join("");
                html = `
                    <div class="runs-list">
                        <div class="run-header">
                            <span class="run-date" data-i18n="engine.start_time">Start Time</span>
                            <span class="run-date" data-i18n="engine.stop_time">Stop Time</span>
                            <span class="run-duration" data-i18n="engine.duration_min">Duration (min)</span>
                            <span class="run-avg" data-i18n="engine.avg_speed">Avg Speed</span>
                            <span class="run-max" data-i18n="engine.max_speed">Max Speed</span>
                        </div>
                        ${runRows}
                    </div>
                `;
            } else {
                const events = data.events || [];
                if (events.length === 0) {
                    container.innerHTML = '<div class="empty" data-i18n="engine.no_events">No events found.</div>';
                    t.translateAllElements();
                    return;
                }
                const eventRows = events.map(evt => `
                    <div class="event-row">
                        <span class="event-time">${new Date(evt.timestamp).toLocaleString()}</span>
                        <span class="event-hours">${fmt(evt.total_hours)} h</span>
                        <span class="event-from">${fmt(evt.previous_state)}</span>
                        <span class="event-to">${fmt(evt.current_state)}</span>
                    </div>
                `).join("");
                html = `
                    <div class="events-list">
                        <div class="event-header">
                            <span class="event-time" data-i18n="engine.time">Time</span>
                            <span class="event-hours" data-i18n="engine.total_hours">Total Hours</span>
                            <span class="event-from" data-i18n="engine.from_state">From</span>
                            <span class="event-to" data-i18n="engine.to_state">To</span>
                        </div>
                        ${eventRows}
                    </div>
                `;
            }
            container.innerHTML = html;
            t.translateAllElements();
        }

        function closeEngine(processName) {
            closeWindow(windowKey('engine', processName));
        }

        // --- MPPT (solar charge controller) view -----------------------------
        async function openMppt(processName) {
            const win = createWindow('mppt', processName, t.t("mppt.title") || "MPPT", (w) => {
                stopMpptRefresh(w);
            });
            win.processName = processName;
            win.body.innerHTML = `<div class="empty">${t.t("general.loading")}</div>`;
            try {
                await refreshMppt(win);
                startMpptRefresh(win);
            } catch (e) {
                win.body.innerHTML = `<div class="empty">${escapeHtml(e.message)}</div>`;
            }
        }

        function stopMpptRefresh(win) {
            if (win.mpptTimer) { clearTimeout(win.mpptTimer); win.mpptTimer = null; }
        }

        async function refreshMppt(win) {
            const processName = win.processName;
            try {
                const data = await apiGet(`/api/mppt/${encodeURIComponent(processName)}/status`);
                renderMpptDashboard(data, processName, win);
                // When communication with the device is lost, the readings are
                // frozen: do not fetch the trend, show a no-trend notice instead.
                if (data.ok && data.communication_ok === false) {
                    const c = win.body.querySelector('.mppt-trend-canvas');
                    if (c) c.innerHTML = `<div class="empty">${t.t("mppt.no_trend") || "No trend (communication lost)"}</div>`;
                } else {
                    // Fetch the trend separately so the dashboard renders first.
                    try {
                        const trend = await apiGet(`/api/mppt/${encodeURIComponent(processName)}/trend`);
                        renderMpptTrend(trend, win);
                    } catch (te) {
                        const c = win.body.querySelector('.mppt-trend-canvas');
                        if (c) c.innerHTML = `<div class="empty">${escapeHtml(te.message)}</div>`;
                    }
                }
            } catch (e) {
                win.body.innerHTML = `<div class="empty">${escapeHtml(e.message)}</div>`;
            }
        }

        function startMpptRefresh(win) {
            stopMpptRefresh(win);
            const processName = win.processName;
            async function tick() {
                if (activeWindows.get(windowKey('mppt', processName)) !== win) return;
                await refreshMppt(win);
                win.mpptTimer = setTimeout(tick, REFRESH_INTERVAL);
            }
            win.mpptTimer = setTimeout(tick, REFRESH_INTERVAL);
        }

        // A vertical bargraph (0 at the bottom). value/clamp against max.
        // A null value (communication lost) renders an empty bar and '--'.
        // fillClass selects the bar color scheme.
        function mpptBar(label, value, max, unit, fillClass) {
            const fc = fillClass || 'mppt-fill-voltage';
            if (value === null || value === undefined) {
                return `<div class="mppt-bar">
                    <div class="mppt-bar-track"></div>
                    <div class="mppt-bar-label">${label}</div>
                    <div class="mppt-bar-value">-- ${unit}</div>
                </div>`;
            }
            const v = Number(value) || 0;
            const m = Number(max) || 0;
            const pct = m > 0 ? Math.max(0, Math.min(100, (v / m) * 100)) : 0;
            return `<div class="mppt-bar">
                <div class="mppt-bar-track">
                    <div class="mppt-bar-fill ${fc}" style="height:${pct}%"></div>
                </div>
                <div class="mppt-bar-label">${label}</div>
                <div class="mppt-bar-value">${fmt(Math.round(v * 100) / 100)} ${unit}</div>
            </div>`;
        }

        function renderMpptDashboard(data, processName, win) {
            const body = win.body;
            if (!data.ok) {
                body.innerHTML = `<div class="empty">${escapeHtml(data.error || "Error")}</div>`;
                t.translateAllElements();
                return;
            }
            const p = data.parameters || {};
            const o = data.output || {};
            // Bargraph maxima come from the device parameters; fall back to
            // sensible defaults when a parameter is absent.
            const maxPV = p.panel_max_voltage || 100;
            const maxV = p.max_voltage || 15;
            const maxI = (p.panel_max_power && maxV) ? p.panel_max_power / maxV : 50;
            const maxP = p.panel_max_power || 400;
            // window title carries the device identity: prefer the
            // device label, then the model, then the product id.
            const devTitle = data.device_label || data.device_model || data.product_id || processName;
            win.headerTitle.textContent = `${t.t("mppt.title") || "MPPT"} \u2014 ${escapeHtml(devTitle)}`;
            const comLost = data.communication_ok === false;
            const info = `
                <div class="mppt-info">
                    ${comLost ? `<div class="mppt-com-lost" data-i18n="mppt.com_lost">Communication lost</div>` : ""}
                    ${data.device_label ? `<div class="row"><span class="k" data-i18n="mppt.device_label">Label</span><span class="v">${escapeHtml(data.device_label)}</span></div>` : ""}
                    ${data.device_model ? `<div class="row"><span class="k" data-i18n="mppt.device_model">Model</span><span class="v">${escapeHtml(data.device_model)}</span></div>` : ""}
                    <div class="row"><span class="k" data-i18n="mppt.error">Error</span><span class="v">${fmt(data.error)}</span></div>
                    <div class="row"><span class="k" data-i18n="mppt.state">State</span><span class="v">${fmt(data.state)}</span></div>
                    <div class="row"><span class="k" data-i18n="mppt.mppt_state">MPPT</span><span class="v">${fmt(data.mppt_state)}</span></div>
                    <div class="row"><span class="k" data-i18n="mppt.day_max_power">Day max power</span><span class="v">${fmt(data.day_max_power)} W</span></div>
                    <div class="row"><span class="k" data-i18n="mppt.day_power">Day energy</span><span class="v">${fmt(data.day_power)} Wh</span></div>
                    <div class="row"><button class="open-btn compact" id="mppt-details-${escapeHtml(processName)}" data-i18n="mppt.details">Details</button></div>
                </div>
            `;
            // panel_voltage is green when it exceeds the output voltage by
            // more than 5 V (panel producing), otherwise dark orange.
            const pvClass = (o.panel_voltage != null && o.voltage != null && Number(o.panel_voltage) > Number(o.voltage) + 5)
                ? 'mppt-fill-panel-ok' : 'mppt-fill-panel-low';
            const bars = `
                <div class="mppt-bars">
                    ${mpptBar(t.t("mppt.panel_voltage"), o.panel_voltage, maxPV, "V", pvClass)}
                    ${mpptBar(t.t("mppt.voltage"), o.voltage, maxV, "V", "mppt-fill-voltage")}
                    ${mpptBar(t.t("mppt.current"), o.current, maxI, "A", "mppt-fill-current")}
                    ${mpptBar(t.t("mppt.panel_power"), o.panel_power, maxP, "W", "mppt-fill-power")}
                </div>
            `;
            body.innerHTML = `
                <div class="mppt-dashboard">
                    <div class="mppt-top">${info}${bars}</div>
                    <div class="mppt-trend">
                        <div class="mppt-trend-title" data-i18n="mppt.trend">Power trend</div>
                        <div class="mppt-trend-canvas"><div class="empty">${t.t("general.loading")}</div></div>
                    </div>
                    <div id="mppt-details-modal-${escapeHtml(processName)}" class="modal">
                        <div class="modal-content" style="max-width:420px">
                            <div class="modal-header">
                                <h2 data-i18n="mppt.details">Device details</h2>
                                <button class="modal-close" onclick="closeMpptDetails('${escapeHtml(processName)}')" title="Close">&times;</button>
                            </div>
                            <div class="mppt-info">
                                <div class="row"><span class="k" data-i18n="mppt.product">Product</span><span class="v">${fmt(data.product_id)}</span></div>
                                <div class="row"><span class="k" data-i18n="mppt.firmware">Firmware</span><span class="v">${fmt(data.firmware)}</span></div>
                                <div class="row"><span class="k" data-i18n="mppt.serial">Serial</span><span class="v">${fmt(data.serial)}</span></div>
                            </div>
                        </div>
                    </div>
                </div>
            `;
            const detailsBtn = body.querySelector('#mppt-details-' + CSS.escape(processName));
            if (detailsBtn) detailsBtn.addEventListener('click', () => {
                const m = body.querySelector('#mppt-details-modal-' + CSS.escape(processName));
                if (m) m.classList.add('show');
            });
            t.translateAllElements();
        }

        function renderMpptTrend(trend, win) {
            const canvas = win.body.querySelector('.mppt-trend-canvas');
            if (!canvas) return;
            if (!trend.ok) {
                canvas.innerHTML = `<div class="empty">${escapeHtml(trend.error || "Error")}</div>`;
                return;
            }
            const values = trend.values || [];
            if (!values.length) {
                canvas.innerHTML = `<div class="empty" data-i18n="mppt.no_trend">No trend data</div>`;
                t.translateAllElements();
                return;
            }
            const W = 100, H = 100;
            const powers = values.map(v => Number(v.panel_power) || 0);
            const maxP = Math.max(...powers, 1);
            const n = values.length;
            // Polyline in a 100x100 viewBox; panel_power on Y (0 at bottom).
            const pts = powers.map((pwr, i) => {
                const x = n === 1 ? W / 2 : (i / (n - 1)) * W;
                const y = H - (pwr / maxP) * H;
                return `${x.toFixed(2)},${y.toFixed(2)}`;
            }).join(" ");
            // Area fill (yellow below) + line (blue above).
            const area = `0,${H} ${pts} ${W},${H}`;
            canvas.innerHTML = `
                <svg class="mppt-trend-svg" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
                    <polygon class="mppt-trend-area" points="${area}"/>
                    <polyline class="mppt-trend-line" points="${pts}" fill="none"/>
                </svg>
                <div class="mppt-trend-axis">${t.t("mppt.trend_power") || "Panel power (W)"} \u00b7 ${Math.round(maxP)} W max</div>
            `;
        }

        function closeMppt(processName) {
            closeWindow(windowKey('mppt', processName));
        }

        function closeMpptDetails(processName) {
            const win = activeWindows.get(windowKey('mppt', processName));
            const m = win && win.body.querySelector('#mppt-details-modal-' + CSS.escape(processName));
            if (m) m.classList.remove('show');
        }

        // --- Battery Service Functions ---
        let batteryAutoRefreshTimer = null;
        const BATTERY_REFRESH_INTERVAL = 5000;

        async function openBattery(processName) {
            const win = createWindow('battery', processName, t.t("battery.title") || "Battery", (w) => {
                stopBatteryRefresh(w);
            });
            win.processName = processName;
            // Make battery window wider to accommodate labels and bars
            win.element.style.width = '680px';
            win.body.innerHTML = `<div class="empty">${t.t("general.loading")}</div>`;
            try {
                await refreshBattery(win);
                startBatteryRefresh(win);
            } catch (e) {
                win.body.innerHTML = `<div class="empty">${escapeHtml(e.message)}</div>`;
            }
        }

        function stopBatteryRefresh(win) {
            if (win.batteryTimer) { clearTimeout(win.batteryTimer); win.batteryTimer = null; }
        }

        function startBatteryRefresh(win) {
            stopBatteryRefresh(win);
            win.batteryTimer = setTimeout(() => {
                refreshBattery(win);
                startBatteryRefresh(win);
            }, BATTERY_REFRESH_INTERVAL);
        }

        async function refreshBattery(win) {
            const processName = win.processName;
            try {
                const data = await apiGet(`/api/battery/${encodeURIComponent(processName)}/status`);
                renderBatteryDashboard(data, processName, win);
                // Fetch trend separately
                try {
                    const trend = await apiGet(`/api/battery/${encodeURIComponent(processName)}/trend`);
                    renderBatteryTrend(trend, win);
                } catch (te) {
                    const c = win.body.querySelector('.battery-trend-canvas');
                    if (c) c.innerHTML = `<div class="empty">${escapeHtml(te.message)}</div>`;
                }
            } catch (e) {
                win.body.innerHTML = `<div class="empty">${escapeHtml(e.message)}</div>`;
            }
        }

        // A vertical bargraph for battery with optional zero center.
        // For positive/negative values, the fill starts from the middle (50%)
        function batteryBar(label, value, max, unit, fillClass, centered = false) {
            if (value === null || value === undefined) {
                return `<div class="battery-bar">
                    <div class="battery-bar-track"></div>
                    <div class="battery-bar-label">${label}</div>
                    <div class="battery-bar-value">-- ${unit}</div>
                </div>`;
            }
            const v = Number(value) || 0;
            const m = Number(max) || 0;
            const displayValue = v.toFixed(v % 1 === 0 ? 0 : 1);
            if (centered) {
                // Centered bar: positive grows up from middle, negative grows down from middle
                const absV = Math.abs(v);
                const pct = m > 0 ? Math.max(0, Math.min(100, (absV / m) * 100)) : 0;
                const fillClassName = v >= 0 ? fillClass + '-pos' : fillClass + '-neg';
                const positionStyle = v >= 0 ? 'bottom: 50%' : 'top: 50%';
                return `<div class="battery-bar">
                    <div class="battery-bar-track">
                        <div class="battery-bar-fill ${fillClassName}" style="height:${pct}%; ${positionStyle}; left: 0; right: 0; position: absolute;"></div>
                        <div class="battery-bar-zero-line"></div>
                    </div>
                    <div class="battery-bar-label">${label}</div>
                    <div class="battery-bar-value">${displayValue} ${unit}</div>
                </div>`;
            } else {
                // Standard bar: grows up from bottom
                const pct = m > 0 ? Math.max(0, Math.min(100, (v / m) * 100)) : 0;
                return `<div class="battery-bar">
                    <div class="battery-bar-track">
                        <div class="battery-bar-fill ${fillClass}" style="height:${pct}%; bottom: 0;"></div>
                    </div>
                    <div class="battery-bar-label">${label}</div>
                    <div class="battery-bar-value">${displayValue} ${unit}</div>
                </div>`;
            }
        }

        function renderBatteryTrend(trend, win) {
            const canvas = win.body.querySelector('.battery-trend-canvas');
            if (!canvas) return;
            if (!trend.ok) {
                canvas.innerHTML = `<div class="empty">${escapeHtml(trend.error || "Error")}</div>`;
                return;
            }
            const values = trend.samples || [];
            if (!values.length) {
                canvas.innerHTML = `<div class="empty" data-i18n="general.loading">Loading...</div>`;
                t.translateAllElements();
                return;
            }
            const W = 100, H = 100;
            // Battery trend uses power instead of energy_variation
            const powerValues = values.map(v => Number(v.power || 0));
            const maxAbs = Math.max(...powerValues.map(Math.abs), 1); // Maximum absolute value
            const n = values.length;
            // Polyline in a 100x100 viewBox; power on Y with 0 at center
            // Positive values above centerline, negative values below
            const pts = powerValues.map((val, i) => {
                const x = n === 1 ? W / 2 : (i / (n - 1)) * W;
                const y = H / 2 - (val / maxAbs) * (H / 2);
                return `${x.toFixed(2)},${y.toFixed(2)}`;
            }).join(" ");
            // Area fill: create polygon from centerline to points to edge
            const centerY = H / 2;
            const areaPts = [`0,${centerY}`].concat(pts.split(' ')).concat([`${W},${centerY}`]).join(" ");
            const maxVal = Math.max(...powerValues, 0);
            const minVal = Math.min(...powerValues, 0);
            canvas.innerHTML = `
                <svg class="battery-trend-svg" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
                    <polygon class="battery-trend-area" points="${areaPts}"/>
                    <polyline class="battery-trend-line" points="${pts}" fill="none"/>
                    <line class="battery-trend-zero" x1="0" y1="${centerY}" x2="${W}" y2="${centerY}" stroke="#ffffff" stroke-width="0.5" stroke-dasharray="2,2"/>
                </svg>
                <div class="battery-trend-axis">${fmt(maxVal)} W max, ${fmt(minVal)} W min</div>
            `;
        }

        function renderBatteryDashboard(data, processName, win) {
            const body = win.body;
            if (!data.ok) {
                body.innerHTML = `<div class="empty">${escapeHtml(data.error || "Error")}</div>`;
                t.translateAllElements();
                return;
            }
            
            const label = data.label || processName;
            const deviceModel = data.device_model || "Unknown";
            const nominalCapacityRaw = data.nominal_capacity || 100;
            const nominalVoltageRaw = data.nominal_voltage || 12;
            const voltage = data.voltage || 0;
            const current = data.current || 0;
            const power = data.power || 0;
            const soc = data.state_of_charge || 0;
            const energy = data.energy || 0;
            
            win.headerTitle.textContent = `${t.t("battery.title") || "Battery"} \u2014 ${escapeHtml(label)}`;
            
            // Calculate max values for bars
            // Use reasonable defaults that ensure bars are visible even for small values
            const maxVoltage = nominalVoltageRaw ? nominalVoltageRaw * 1.2 : 20; // 20% above nominal
            const maxCurrent = Math.max(Math.abs(current) * 1.5, 2); // 1.5x actual or 2A min
            const maxPower = Math.max(Math.abs(power) * 1.5, 20); // 1.5x actual or 20W min
            const maxEnergy = energy ? energy * 1.2 : 10000;
            const maxSoc = 100;
            
            // Format values for display
            const nominalCapacityDisplay = `${nominalCapacityRaw.toFixed(nominalCapacityRaw % 1 === 0 ? 0 : 1)} Ah`;
            const nominalVoltageDisplay = `${nominalVoltageRaw.toFixed(nominalVoltageRaw % 1 === 0 ? 0 : 1)} V`;
            
            const info = `
                <div class="battery-info">
                    ${deviceModel !== "Unknown" ? `<div class="row"><span class="k" data-i18n="battery.device_model">Model</span><span class="v">${escapeHtml(deviceModel)}</span></div>` : ""}
                    <div class="row"><span class="k" data-i18n="battery.nominal_capacity">Nominal Capacity</span><span class="v">${nominalCapacityDisplay}</span></div>
                    <div class="row"><span class="k" data-i18n="battery.nominal_voltage">Nominal Voltage</span><span class="v">${nominalVoltageDisplay}</span></div>
                    <div class="row"><button class="open-btn compact" id="battery-details-${CSS.escape(processName)}" data-i18n="battery.details">Details</button></div>
                </div>
            `;
            
            const bars = `
                <div class="battery-bars">
                    ${batteryBar(t.t("battery.voltage"), voltage, maxVoltage, "V", "battery-fill-voltage")}
                    ${batteryBar(t.t("battery.current"), current, maxCurrent, "A", "battery-fill-current", true)}
                    ${batteryBar(t.t("battery.power"), power, maxPower, "W", "battery-fill-power", true)}
                    ${batteryBar(t.t("battery.state_of_charge"), soc, maxSoc, "%", "battery-fill-soc")}
                    ${batteryBar(t.t("battery.energy"), energy, maxEnergy, "Wh", "battery-fill-energy")}
                </div>
            `;
            
            body.innerHTML = `
                <div class="battery-dashboard">
                    <div class="battery-top">${info}${bars}</div>
                    <div class="battery-trend">
                        <div class="battery-trend-title" data-i18n="battery.trend">Power Trend</div>
                        <div class="battery-trend-canvas"><div class="empty" data-i18n="general.loading">Loading...</div></div>
                    </div>
                    <div id="battery-details-modal-${CSS.escape(processName)}" class="modal">
                        <div class="modal-content" style="max-width:420px">
                            <div class="modal-header">
                                <h2 data-i18n="battery.details">Details</h2>
                                <button class="modal-close" onclick="closeBatteryDetails('${CSS.escape(processName)}')" title="Close">&times;</button>
                            </div>
                            <div class="battery-info">
                                <div class="row"><span class="k" data-i18n="battery.label">Label</span><span class="v">${escapeHtml(label)}</span></div>
                                <div class="row"><span class="k" data-i18n="battery.device_model">Model</span><span class="v">${escapeHtml(deviceModel)}</span></div>
                                <div class="row"><span class="k" data-i18n="battery.nominal_voltage">Nominal Voltage</span><span class="v">${nominalVoltageDisplay}</span></div>
                                <div class="row"><span class="k" data-i18n="battery.nominal_capacity">Nominal Capacity</span><span class="v">${nominalCapacityDisplay}</span></div>
                            </div>
                        </div>
                    </div>
                </div>
            `;
            
            // Setup details button
            const detailsBtn = body.querySelector('#battery-details-' + CSS.escape(processName));
            if (detailsBtn) {
                detailsBtn.addEventListener('click', () => {
                    const m = body.querySelector('#battery-details-modal-' + CSS.escape(processName));
                    if (m) m.classList.add('show');
                });
            }
            
            t.translateAllElements();
        }

        function closeBattery(processName) {
            closeWindow(windowKey('battery', processName));
        }

        function closeBatteryDetails(processName) {
            const win = activeWindows.get(windowKey('battery', processName));
            const m = win && win.body.querySelector('#battery-details-modal-' + CSS.escape(processName));
            if (m) m.classList.remove('show');
        }

        // --- Window function exports ---
        window.procCmd = procCmd;
        window.systemCmd = systemCmd;
        window.systemCmdConfirm = systemCmdConfirm;
        window.openLog = openLog;
        window.openNetwork = openNetwork;
        window.closeNetwork = closeNetwork;
        window.openNmea2000 = openNmea2000;
        window.closeNmea2000 = closeNmea2000;
        window.nmea2000TraceCmd = nmea2000TraceCmd;
        window.openNmea2000Device = openNmea2000Device;
        window.backToNmea2000List = backToNmea2000List;
        window.applyNetworkConfig = applyNetworkConfig;
        window.openConsole = openConsole;
        window.closeConsole = closeConsole;
        window.couplerCmd = couplerCmd;


        window.networkInterfaceCmd = networkInterfaceCmd;
        window.addConnection = addConnection;
        window.showAddConnection = showAddConnection;

        window.openEngineData = openEngineData;
        window.closeEngine = closeEngine;
        window.setEngineEventsMode = setEngineEventsMode;
        window.openMppt = openMppt;
        window.closeMppt = closeMppt;
        window.closeMpptDetails = closeMpptDetails;
        window.openBattery = openBattery;
        window.closeBattery = closeBattery;
        window.closeBatteryDetails = closeBatteryDetails;
        $("refresh-btn").addEventListener("click", refresh);
        $("auto-refresh").addEventListener("change", toggleAuto);
        $("login-form").addEventListener("submit", async (e) => {
            e.preventDefault();
            const err = $("login-error");
            err.textContent = "";
            const u = $("login-username").value;
            const p = $("login-password").value;
            const btn = $("login-submit");
            btn.disabled = true;
            try {
                const ok = await performLogin(u, p);
                if (ok) {
                    hideLoginOverlay();
                } else {
                    err.textContent = t.t("auth.invalid");
                }
            } catch (ex) {
                err.textContent = t.t("auth.error");
            } finally {
                btn.disabled = false;
            }
        });
        refresh();

    
    // Function to translate all data-i18n elements on the page
    function translateAllElements() {
        const elements = document.querySelectorAll('[data-i18n]');
        elements.forEach(el => {
            const key = el.getAttribute('data-i18n');
            if (key) {
                el.textContent = t.t(key);
            }
        });
    }
    
    // Call translation on page load and language change
    async function initPageTranslations() {
        try {
            // Don't treat initialization errors as connection errors
            // Only show connection lost when main API calls fail
            await initWebTranslations();
            translateAllElements();
            // Also re-translate when language changes (if needed)
            
            // Check EnergyService availability and update UI
            emsAvailable = await updateEmsVisibility();
        } catch (e) {
            // Don't show connection lost during initialization
            // This prevents false positives from config/config issues
            console.error("Initialization error:", e);
        }
    }
    

    // --- Energy Management System (EMS) --------------------------------
    let emsAutoRefreshTimer = null;
    const EMS_REFRESH_INTERVAL = 5000; // 5 seconds
    let emsAvailable = false; // Track EMS availability

    // Show either services or ems page
    function showPage(page) {
        // If EMS is requested but not available, fallback to services
        if (page === "ems" && !emsAvailable) {
            page = "services";
        }

        // Update nav button states
        const servicesBtn = $("nav-services");
        const emsBtn = $("nav-ems");
        if (servicesBtn) {
            servicesBtn.classList.remove("active");
            if (page === "services") servicesBtn.classList.add("active");
        }
        if (emsBtn) {
            emsBtn.classList.remove("active");
            if (page === "ems") emsBtn.classList.add("active");
        }

        // Show/hide pages
        const servicesPage = $("services-page");
        const emsPage = $("ems-page");
        if (servicesPage) {
            servicesPage.classList.remove("active");
            if (page === "services") servicesPage.classList.add("active");
        }
        if (emsPage) {
            emsPage.classList.remove("active");
            if (page === "ems") emsPage.classList.add("active");
        }

        // Start/stop EMS auto-refresh
        if (page === "ems") {
            startEmsRefresh();
        } else {
            stopEmsRefresh();
        }
    }

    function stopEmsRefresh() {
        if (emsAutoRefreshTimer) {
            clearTimeout(emsAutoRefreshTimer);
            emsAutoRefreshTimer = null;
        }
    }

    function startEmsRefresh() {
        stopEmsRefresh();
        refreshEms();
    }

    // Map EnergySource enum values to human-readable type names
    const energySourceTypeNames = {
        0: "Battery",
        1: "Solar",
        2: "Alternator",
        3: "AC Charger",
        4: "DC-DC Charger",
        5: "Windmill",
        6: "Hydro Generator",
        7: "AC Generator",
        8: "AC-DC Converter"
    };

    // Format value with unit
    function emsFmt(value, unit = "") {
        if (value === 0 || value === null || value === undefined) return "--";
        if (typeof value === "number") {
            if (unit === "W" || unit === "Wh") {
                return value.toFixed(0) + " " + unit;
            }
            if (unit === "A" || unit === "V") {
                return value.toFixed(1) + " " + unit;
            }
            if (unit === "%") {
                return value.toFixed(1) + " " + unit;
            }
            return value.toFixed(2);
        }
        return escapeHtml(value);
    }

    // Energy source type name from enum value
    function getEnergySourceTypeName(typeValue) {
        return energySourceTypeNames[typeValue] || ("Type " + typeValue);
    }

    // Render EMS dashboard
    function renderEmsDashboard(data) {
        const dashboard = $("ems-dashboard");
        if (!dashboard) return;

        // Handle missing or invalid data gracefully
        if (!data) {
            dashboard.innerHTML = '<div class="empty" data-i18n="ems.loading">Loading Energy Management System data...</div>';
            t.translateAllElements();
            return;
        }

        // Extract data with defaults
        const batteries = data.batteries || [];
        const sources = data.sources || [];

        // Filter to get only instance 0 for single instance assumption
        const battery = batteries.find(b => b.instance === 0) || batteries[0] || {};
        const batteryData = battery.battery_data || {};

        // Build the dashboard HTML
        let html = '';

        // Top row: Energy Controller Data (left) and Battery Data (right)
        html += '<div class="ems-top">';

        // Left box: Energy Controller Data (excluding sources_data and batteries_data)
        html += '<div class="ems-box">';
        html += '<h2 data-i18n="ems.controller_title">Energy Controller</h2>';
        html += '<div class="ems-bars">';

        // Main voltage
        html += createEmsBar(
            t.t("ems.main_voltage"),
            data.main_voltage || 0,
            "V",
            "#0000ff",
            0,
            data.maximum_main_voltage || 30
        );

        // Auxiliary voltage
        html += createEmsBar(
            t.t("ems.auxiliary_voltage"),
            data.auxiliary_voltage || 0,
            "V",
            "#55aaff",
            0,
            data.maximum_main_voltage || 30
        );

        // Production power
        html += createEmsBar(
            t.t("ems.production_power"),
            data.production_power || 0,
            "W",
            "#ff9900",
            0,
            Math.max((data.production_power || 0) * 2, 1000)
        );

        // Consumption power
        html += createEmsBar(
            t.t("ems.consumption_power"),
            data.consumption_power || 0,
            "W",
            "#ff9900",
            0,
            Math.max((data.consumption_power || 0) * 2, 1000)
        );

        // Energy stock
        html += createEmsBar(
            t.t("ems.energy_stock"),
            data.energy_stock || 0,
            "Wh",
            "#9900ff",
            0,
            Math.max((data.energy_stock || 0) * 2, 10000)
        );

        // Battery balance
        html += createEmsBar(
            t.t("ems.battery_balance"),
            data.battery_balance || 0,
            "W",
            "#ff9900",
            0,
            Math.max(Math.abs(data.battery_balance || 0) * 2, 500)
        );

        html += '</div></div>';

        // Right box: Battery Data
        html += '<div class="ems-box">';
        html += '<h2 data-i18n="ems.battery_title">Battery</h2>';
        html += '<div class="ems-bars">';

        // Battery current (centered at 0)
        const batteryCurrent = batteryData.current || 0;
        html += createEmsCenteredBar(
            t.t("ems.battery_current"),
            batteryCurrent,
            "A",
            "#ff00ff",
            Math.max(Math.abs(batteryCurrent) * 2, 2)
        );

        // State of charge
        const soc = batteryData.state_of_charge || 0;
        html += createEmsBar(
            t.t("ems.state_of_charge"),
            soc,
            "%",
            "#ffff00",
            0,
            100
        );

        // Battery power
        const batteryPower = batteryData.power || 0;
        html += createEmsCenteredBar(
            t.t("ems.battery_power"),
            batteryPower,
            "W",
            "#ff9900",
            Math.max(Math.abs(batteryPower) * 2, 20)
        );

        // Battery energy
        const batteryEnergy = batteryData.energy || 0;
        html += createEmsBar(
            t.t("ems.battery_energy"),
            batteryEnergy,
            "Wh",
            "#9900ff",
            0,
            Math.max(batteryEnergy * 2, 10000)
        );

        // Battery trend
        if (battery.trend && battery.trend.samples && battery.trend.samples.length > 0) {
            html += '</div>';
            html += '<div class="ems-trend">';
            html += '<div class="ems-trend-title" data-i18n="ems.battery_trend">Battery Trend</div>';
            html += '<div class="ems-trend-canvas" id="ems-battery-trend"></div>';
            html += '</div>';
        }
        html += '</div></div>';

        // Energy source rows
        html += '<div class="ems-sources">';
        
        if (sources.length === 0) {
            html += '<div class="empty" data-i18n="ems.no_sources">No energy sources.</div>';
        } else {
            for (const source of sources) {
                const sourceData = source.source_data || {};
                const instance = source.instance_id || source.instance || 0;
                const label = source.label || ("Source " + instance);
                const type = source.type || 0;
                const typeName = getEnergySourceTypeName(type);
                
                // For single instance, only show instance 0
                if (instance !== 0) continue;

                const current = sourceData.current || 0;
                const power = sourceData.power || 0;
                const communicationOk = sourceData.communication_ok !== undefined ? sourceData.communication_ok : true;
                const deviceOn = sourceData.device_on !== undefined ? sourceData.device_on : true;

                html += '<div class="ems-source-row">';
                html += '<div class="ems-source-header">';
                html += '<span class="ems-source-title">' + escapeHtml(label) + '</span>';
                html += '<span class="ems-source-type">' + escapeHtml(typeName) + '</span>';
                html += '<span class="ems-source-state">';
                if (!communicationOk) {
                    html += '<span class="ems-source-state-indicator grey"></span>';
                    html += '<span>' + t.t("ems.no_communication") + '</span>';
                } else {
                    html += '<span class="ems-source-state-indicator ' + (deviceOn ? '' : 'off') + '"></span>';
                    html += '<span>' + (deviceOn ? t.t("ems.on") : t.t("ems.off")) + '</span>';
                }
                html += '</span>';
                html += '</div>';
                html += '<div class="ems-source-body">';
                // Bars container - takes 1/3 width
                html += '<div class="ems-source-bars">';
                html += createEmsBar(t.t("ems.current"), Math.abs(current), "A", "#ff00ff", 0, Math.max(Math.abs(current) * 2, 50));
                html += createEmsBar(t.t("ems.power"), Math.abs(power), "W", "#ff9900", 0, Math.max(Math.abs(power) * 2, 500));
                html += '</div>';
                
                // Trend container - takes 2/3 width
                html += '<div class="ems-source-trend-container">';
                if (source.trend && source.trend.samples && source.trend.samples.length > 0) {
                    html += '<div class="ems-trend">';
                    html += '<div class="ems-trend-title" data-i18n="ems.source_trend">Trend</div>';
                    html += '<div class="ems-trend-canvas" id="ems-source-trend-' + instance + '"></div>';
                    html += '</div>';
                }
                html += '</div>';
                html += '</div></div>';
            }
        }
        
        html += '</div>';

        dashboard.innerHTML = html;
        t.translateAllElements();

        // Render trends if data is available
        if (battery.trend && battery.trend.samples && battery.trend.samples.length > 0) {
            renderEmsTrend(battery.trend, "ems-battery-trend", "state_of_charge");
        }
        for (const source of sources) {
            const instance = source.instance_id || source.instance || 0;
            if (instance !== 0) continue;
            if (source.trend && source.trend.samples && source.trend.samples.length > 0) {
                renderEmsTrend(source.trend, "ems-source-trend-" + instance, "power");
            }
        }
    }

    function createEmsBar(label, value, unit, color, minVal, maxVal) {
        const percent = Math.min(Math.max((value - minVal) / (maxVal - minVal) * 100, 0), 100);
        return `
            <div class="ems-bar">
                <div class="ems-bar-label">${escapeHtml(label)}</div>
                <div class="ems-bar-container">
                    <div class="ems-bar-fill" style="height: ${percent}%; background: ${color}; bottom: 0; width: 100%;"></div>
                </div>
                <div class="ems-bar-value">${emsFmt(value, unit)}</div>
            </div>
        `;
    }

    function createEmsCenteredBar(label, value, unit, color, maxAbsValue) {
        const absValue = Math.abs(value);
        const percent = Math.min((absValue / maxAbsValue) * 100, 100);
        const isPositive = value >= 0;
        const fillClass = isPositive ? "positive" : "negative";
        const direction = isPositive ? "Charging" : "Discharging";
        const positionStyle = isPositive ? 'bottom: 50%' : 'top: 50%';
        
        return `
            <div class="ems-bar">
                <div class="ems-bar-label">${escapeHtml(label)} (${direction})</div>
                <div class="ems-bar-container">
                    <div class="ems-bar-fill ${fillClass}" style="height: ${percent}%; background: ${color};"></div>
                    <div class="ems-bar-zero-line"></div>
                </div>
                <div class="ems-bar-value">${emsFmt(value, unit)}</div>
            </div>
        `;
    }

    function renderEmsTrend(trend, canvasId, fieldName) {
        const canvas = $(canvasId);
        if (!canvas) return;

        const values = trend.samples || [];
        if (!values.length) {
            canvas.innerHTML = '<div class="empty">No data</div>';
            return;
        }

        const W = 100, H = 100;
        let dataValues = [];
        
        if (fieldName === "state_of_charge") {
            dataValues = values.map(v => v.state_of_charge || 0);
        } else {
            dataValues = values.map(v => {
                if (v.power !== undefined) return v.power;
                if (v.panel_power !== undefined) return v.panel_power;
                if (v.current !== undefined && v.voltage !== undefined) return v.current * v.voltage;
                return 0;
            });
        }

        const minVal = Math.min(...dataValues, 0);
        const maxVal = Math.max(...dataValues, 1);
        const range = maxVal - minVal || 1;

        const n = dataValues.length;
        const pts = dataValues.map((val, i) => {
            const x = n === 1 ? W / 2 : (i / (n - 1)) * W;
            const y = H - ((val - minVal) / range) * H;
            return `${x.toFixed(2)},${y.toFixed(2)}`;
        }).join(" ");

        const area = `0,${H} ${pts} ${W},${H}`;

        canvas.innerHTML = `
            <svg class="ems-trend-svg" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
                <polygon class="ems-trend-area" points="${area}"/>
                <polyline class="ems-trend-line" points="${pts}" fill="none"/>
            </svg>
            <div class="ems-trend-axis">${emsFmt(maxVal, fieldName === "state_of_charge" ? "%" : "W")} max</div>
        `;
    }

    async function fetchEmsData() {
        try {
            const data = await apiGet("/api/energy");
            return data;
        } catch (e) {
            return { ok: false, error: e.message };
        }
    }

    async function refreshEms() {
        const data = await fetchEmsData();
        renderEmsDashboard(data);
    }

    function startEmsRefresh() {
        stopEmsRefresh();
        refreshEms();
        emsAutoRefreshTimer = setTimeout(startEmsRefresh, EMS_REFRESH_INTERVAL);
    }


    // Initialize on DOM load
    document.addEventListener('DOMContentLoaded', initPageTranslations);
    </script>
