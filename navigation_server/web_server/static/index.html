    <style>
        :root {

            background: var(--bg);
            color: var(--text);

        header {

        main { padding: 24px; max-width: 1400px; margin: 0 auto; }

        .status-display { flex: 1; min-width: 180px; max-width: 220px; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .status-icon { margin-bottom: 10px; }
        /* Engine events mode sliding toggle */

        .events-toggle input { position: absolute; opacity: 0; width: 0; height: 0; }

        .events-toggle input:checked + label { color: var(--text); }

        .events-toggle.mode-events .events-toggle-thumb { transform: translateX(100%); }
        .stats-box { flex: 1; min-width: 200px; max-width: 280px; background: var(--panel-2); border-radius: 8px; padding: 12px; }

        .stat-row:last-child { border-bottom: none; }

        .open-btn.compact { padding: 2px 8px; font-size: 0.75em; }
        /* MPPT (solar charge controller) window */

        .battery-info .k { color: var(--muted); }

        .battery-bar-track { width: 100%; height: 120px; background: var(--panel-2); border: 1px solid var(--border); border-radius: 4px; position: relative; display: flex; align-items: flex-end; overflow: hidden; }

        .battery-bar-label { font-size: 0.72rem; color: var(--muted); height: 2.4em; text-align: center; }
        .battery-bar-value { font-size: 0.78rem; }
        .battery-trend { display: flex; flex-direction: column; gap: 6px; }
        .battery-trend-title { font-size: 0.85rem; color: var(--accent); }
        .battery-trend-canvas { height: 160px; background: var(--panel-2); border: 1px solid var(--border); border-radius: 6px; padding: 8px; display: flex; flex-direction: column; }
        .battery-trend-svg { flex: 1; width: 100%; }
        .battery-trend-area { fill: var(--amber); fill-opacity: 0.35; }
        .battery-trend-line { stroke: var(--accent); stroke-width: 1.5; vector-effect: non-scaling-stroke; }

        @media (max-width: 640px) { .battery-top { grid-template-columns: 1fr; } }
        .run-header { color: var(--muted); border-bottom: 1px solid var(--border); padding-bottom: 6px; }
        .run-row { border-bottom: 1px solid var(--border); }

        .card-actions { display: flex; gap: 6px; margin-top: 12px; flex-wrap: wrap; }

        .toast {
            position: fixed; bottom: 24px; right: 24px;
            background: var(--panel-2);
            border: 1px solid var(--border);

        /* Window System */
        .window-container {
            position: fixed; inset: 0; pointer-events: none; z-index: 1000;
        }
        .service-window {
            position: absolute; background: var(--panel); border: 1px solid var(--border);
            border-radius: 8px; box-shadow: 0 4px 20px rgba(0,0,0,0.5);

            overflow: hidden; display: flex; flex-direction: column;
            pointer-events: auto; cursor: default;
        }
        .window-header {
            display: flex; align-items: center; justify-content: space-between;

<body>

    <script src="translations.js"></script>
<script>
        const REFRESH_INTERVAL = 5000;
        let autoTimer = null;
        let isRefreshing = false;
        let autoEnabled = true;
        let showHidden = false;  // Track whether to show hidden processes
        let backendConnected = true; // Track if we can reach the web server (network-level)

        // Window Management System
        let windowZIndex = 1000;
        let activeWindows = new Map(); // windowKey -> {element, body, header, processName, serviceType, cleanup}
        let isDragging = null;
        let dragOffset = {x: 0, y: 0};
        let nextWindowPos = {x: 80, y: 80};

        const $ = (id) => document.getElementById(id);

        function windowKey(serviceType, processName) {
            return `${serviceType}:${processName}`;
        }

        // Window Management Functions
        // If a single-instance window for (serviceType, processName) is already
        // open, bring it to the front and return its record; otherwise null.
        function focusWindow(serviceType, processName) {
            const key = windowKey(serviceType, processName);
            const win = activeWindows.get(key);
            if (win) {
                win.element.style.zIndex = ++windowZIndex;
                return win;
            }
            return null;
        }

        // Creates an independent, draggable service window. Only one window per
        // (serviceType, processName) exists at a time: calling createWindow again
        // for an open service reuses that window. `onClose` (optional) is invoked
        // when the window closes so callers stop refresh timers.
        function createWindow(serviceType, processName, title, onClose) {
            const existing = focusWindow(serviceType, processName);
            if (existing) {
                existing.headerTitle.textContent = title;
                return existing;
            }

            const key = windowKey(serviceType, processName);
            const windowEl = document.createElement('div');
            windowEl.className = 'service-window';
            const pos = nextWindowPos;
            windowEl.style.left = pos.x + 'px';
            windowEl.style.top = pos.y + 'px';
            windowEl.style.width = '520px';
            windowEl.style.zIndex = ++windowZIndex;
            pos.x = (pos.x + 28) % (window.innerWidth - 560);
            pos.y = (pos.y + 28) % (window.innerHeight - 260);

            const headerEl = document.createElement('div');
            headerEl.className = 'window-header';
            headerEl.innerHTML = `
                <div class="window-title-bar">
                    <h2></h2>
                </div>
                <div class="window-controls">
                    <button class="window-btn minimize" title="Minimize"></button>
                    <button class="window-btn close" title="Close"></button>
                </div>
            `;
            const headerTitle = headerEl.querySelector('h2');
            headerTitle.textContent = title;

            const bodyEl = document.createElement('div');
            bodyEl.className = 'window-body';

            const resizeHandle = document.createElement('div');
            resizeHandle.className = 'window-resize-handle';

            windowEl.appendChild(headerEl);
            windowEl.appendChild(bodyEl);
            windowEl.appendChild(resizeHandle);
            $("window-container").appendChild(windowEl);

            const record = {
                element: windowEl,
                body: bodyEl,
                header: headerEl,
                headerTitle: headerTitle,
                processName: processName,
                serviceType: serviceType,
                cleanup: null,
                _onClose: onClose || null
            };

            headerEl.querySelector('.window-btn.minimize').addEventListener('click', (e) => {
                e.stopPropagation();
                minimizeWindow(key);
            });
            headerEl.querySelector('.window-btn.close').addEventListener('click', (e) => {
                e.stopPropagation();
                closeWindow(key);
            });

            windowEl.addEventListener('mousedown', () => {
                windowEl.style.zIndex = ++windowZIndex;
            });

            makeDraggable(windowEl, headerEl);
            makeResizable(windowEl, resizeHandle);

            activeWindows.set(key, record);
            return record;
        }

        function closeWindow(key) {
            const win = activeWindows.get(key);
            if (!win) return;
            if (win._onClose) {
                try { win._onClose(win); } catch (e) { console.error('window cleanup error', e); }
            }
            if (win.cleanup) {
                try { win.cleanup(); } catch (e) { console.error('window cleanup error', e); }
            }
            win.element.remove();
            activeWindows.delete(key);
        }

        function minimizeWindow(key) {
            const win = activeWindows.get(key);
            if (!win) return;
            const body = win.body;
            body.style.display = body.style.display === 'none' ? '' : 'none';
        }

        function makeDraggable(element, handle) {
            handle.addEventListener('mousedown', (e) => {
                if (e.target.classList.contains('window-btn') || e.target.tagName === 'BUTTON') {
                    return; // Don't drag when clicking buttons
                }
                isDragging = element;
                dragOffset.x = e.clientX - element.getBoundingClientRect().left;
                dragOffset.y = e.clientY - element.getBoundingClientRect().top;
                element.style.cursor = 'move';
                e.preventDefault();
            });
        }

        function makeResizable(element, handle) {
            let resizing = null;
            let start = {x: 0, y: 0, w: 0, h: 0};
            const onMove = (e) => {
                if (!resizing) return;
                resizing.style.width = Math.max(300, start.w + (e.clientX - start.x)) + 'px';
                resizing.style.height = Math.max(200, start.h + (e.clientY - start.y)) + 'px';
            };
            const onUp = () => {
                if (!resizing) return;
                resizing = null;
                document.removeEventListener('mousemove', onMove);
                document.removeEventListener('mouseup', onUp);
            };
            handle.addEventListener('mousedown', (e) => {
                e.preventDefault();
                e.stopPropagation();
                resizing = element;
                const rect = element.getBoundingClientRect();
                start = {x: e.clientX, y: e.clientY, w: rect.width, h: rect.height};
                document.addEventListener('mousemove', onMove);
                document.addEventListener('mouseup', onUp);
            });
        }

        document.addEventListener('mousemove', (e) => {
            if (isDragging) {
                isDragging.style.left = (e.clientX - dragOffset.x) + 'px';
                isDragging.style.top = (e.clientY - dragOffset.y) + 'px';
            }
        });

        document.addEventListener('mouseup', () => {
            if (isDragging) {
                isDragging.style.cursor = '';
                isDragging = null;
            }
        });

        function toast(msg, ok = true) {
            const toastEl = $("toast");
            toastEl.textContent = msg;
            toastEl.className = "toast show " + (ok ? "ok" : "err");
            setTimeout(() => toastEl.classList.remove("show"), 3500);
        }

        function toggleHidden() {
            showHidden = !showHidden;
            const btn = $("show-hidden-text");
            btn.textContent = showHidden ? "Hide Hidden" : "Show Hidden";
            refresh();
        }

        // Authentication: when the backend returns 401 we show the login
        // overlay, await a successful login, then replay the original request.
        // Cookies travel automatically with same-origin fetch(), so once the
        // session cookie is set no token handling is needed on the client.
        let loginResolver = null; // resolves once a login attempt succeeds

        function showLoginOverlay() {
            $("login-overlay").classList.add("show");
            const u = $("login-username");
            if (u) u.focus();
        }

        function hideLoginOverlay() {
            $("login-overlay").classList.remove("show");
            const err = $("login-error");
            if (err) err.textContent = "";
            if (loginResolver) {
                loginResolver();
                loginResolver = null;
            }
        }

        function awaitLogin() {
            return new Promise((resolve) => { loginResolver = resolve; });
        }

        async function performLogin(username, password) {
            const r = await fetch("/api/login", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ username, password }),
            });
            const data = await r.json().catch(() => ({}));
            return r.ok && data.ok;
        }

        // Intercepts 401: shows the login overlay, waits for a successful
        // login, then resolves so the caller can retry the request.
        async function handleAuthFailure() {
            showLoginOverlay();
            await awaitLogin();
        }

        async function apiGet(path) {
            try {
                let r = await fetch(path, { cache: "no-store" });
                if (r.status === 401) {
                    await handleAuthFailure();
                    r = await fetch(path, { cache: "no-store" });
                }
                if (!r.ok) {
                    // HTTP errors (404, 500, etc.) are not connection errors
                    const error = new Error(`HTTP ${r.status}`);
                    error.status = r.status; // Mark as HTTP error
                    throw error;
                }
                return r.json();
            } catch (e) {
                // For now, only mark as connection error if it's clearly a network failure
                // This prevents false positives from API errors
                if (isBackendDisconnected(e)) {
                    e.isConnectionError = true;
                }
                throw e; // Re-throw so callers can handle the error
            }
        }

        async function apiPost(path, body) {
            try {
                let r = await fetch(path, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(body),
                });
                if (r.status === 401) {
                    await handleAuthFailure();
                    r = await fetch(path, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify(body),
                    });
                }
                if (!r.ok) {
                    // HTTP errors (404, 500, etc.) are not connection errors
                    const error = new Error(`HTTP ${r.status}`);
                    error.status = r.status; // Mark as HTTP error
                    throw error;
                }
                return r.json();
            } catch (e) {
                // For now, only mark as connection error if it's clearly a network failure
                if (isBackendDisconnected(e)) {
                    e.isConnectionError = true;
                }
                throw e; // Re-throw so callers can handle the error
            }
        }

        // Check if EnergyService is available
        async function checkEnergyServiceAvailable() {
            try {
                const data = await apiGet("/api/energy_available");
                return data.available || false;
            } catch (e) {
                // Don't treat EnergyService check failures as connection errors
                // EnergyService might not be running, but backend could still be fine
                console.error("Error checking EnergyService availability:", e);
                return false;
            }
        }

        // Update EMS button visibility based on service availability
        async function updateEmsVisibility() {
            const emsAvailable = await checkEnergyServiceAvailable();
            const emsBtn = $("nav-ems");
            const emsPage = $("ems-page");
            
            if (emsBtn) {
                emsBtn.style.display = emsAvailable ? "" : "none";
            }
            if (emsPage) {
                emsPage.style.display = emsAvailable ? "" : "none";
            }
            
            // If EMS is not available and user is trying to view EMS page, switch to services
            if (!emsAvailable && window.location.hash === "#ems") {
                showPage("services");
            }
            
            return emsAvailable;
        }

        function escapeHtml(s) {
            return String(s ?? "").replace(/[&<>"']/g, c => ({
                "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
            }[c]));
        }

        function fmt(v) { return v === 0 || v ? escapeHtml(v) : "—"; }

        // Function to disable all buttons on the page
        function disableAllButtons() {
            const allButtons = document.querySelectorAll('button');
            allButtons.forEach(button => {
                button.disabled = true;
            });
            // Also disable input elements
            const allInputs = document.querySelectorAll('input[type="checkbox"], input[type="text"], select');
            allInputs.forEach(input => {
                input.disabled = true;
            });
        }

        // Function to enable all buttons on the page
        function enableAllButtons() {
            const allButtons = document.querySelectorAll('button');
            allButtons.forEach(button => {
                button.disabled = false;
            });
            // Also enable input elements
            const allInputs = document.querySelectorAll('input[type="checkbox"], input[type="text"], select');
            allInputs.forEach(input => {
                input.disabled = false;
            });
        }

        // Function to show connection lost state (network-level only)
        function showConnectionLost() {
            if (!backendConnected) return; // Already in disconnected state
            
            backendConnected = false;
            disableAllButtons();
            const overlay = $("connection-lost-overlay");
            if (overlay) {
                overlay.style.display = "flex";
            }
            // Update connection status pill
            const pill = $("conn-status");
            if (pill) {
                pill.className = "status-pill disconnected";
                pill.textContent = t.t("status.disconnected");
            }
            
            // Translate the overlay message
            const messageEl = overlay ? overlay.querySelector('[data-i18n]') : null;
            if (messageEl) {
                messageEl.textContent = t.t("error.connection_lost");
            }
            
            // Also translate the retry button
            const retryBtn = overlay ? overlay.querySelector('button') : null;
            if (retryBtn) {
                retryBtn.textContent = t.t("button.retry");
            }
        }

        // Function to show connection restored state (network-level only)
        function showConnectionRestored() {
            if (backendConnected) return; // Already connected
            
            backendConnected = true;
            enableAllButtons();
            const overlay = $("connection-lost-overlay");
            if (overlay) {
                overlay.style.display = "none";
            }
            // The pill will be updated by render() based on agent connection state
        }

        // Function to check if error indicates backend disconnection
        function isBackendDisconnected(error) {
            // HTTP errors (404, 500, etc.) are NOT connection errors
            if (error.status) {
                return false;
            }
            
            // Check if the error indicates a network/server issue
            const errorStr = String(error).toLowerCase();
            const errorName = String(error.name || "").toLowerCase();
            
            // Only TypeError with "Failed to fetch" indicates actual network failure
            return errorName.includes("typeerror") && errorStr.includes("failed to fetch");
        }

        // Function to retry connection
        async function retryConnection() {
            try {
                // Try to fetch the system status
                const data = await apiGet("/api/system/status");
                // If we got a successful response, the network connection is restored
                showConnectionRestored();
                // Refresh the page to get fresh data
                refresh();
            } catch (e) {
                toast(t.t("toast.refresh_error", {error: e.message}), false);
            }
        }

        async function refresh() {
            if (isRefreshing) return;
            isRefreshing = true;
            const btn = $("refresh-btn");
            btn.disabled = true;
            try {
                const data = await apiGet("/api/system/status");
                render(data);
                $("last-refresh").textContent = new Date().toLocaleTimeString("fr-FR");
                
                // Check EnergyService availability on each refresh
                const newEmsAvailable = await checkEnergyServiceAvailable();
                if (newEmsAvailable !== emsAvailable) {
                    emsAvailable = newEmsAvailable;
                    await updateEmsVisibility();
                }
                
                // If backend reports disconnected (agent not connected), show overlay
                // This handles the case where web server is up but agent is not connected
                if (data && !data.connected) {
                    if (backendConnected) {
                        showConnectionLost();
                    }
                } else {
                    // If we were in disconnected state and now connected, restore UI
                    if (!backendConnected) {
                        showConnectionRestored();
                    }
                }
            } catch (e) {
                toast(t.t("toast.refresh_error", {error: e.message}), false);
                // For network failures, show connection lost overlay
                if (e.isConnectionError || isBackendDisconnected(e)) {
                    if (backendConnected) {
                        showConnectionLost();
                    }
                }
            } finally {
                isRefreshing = false;
                btn.disabled = false;
            }
            if (autoEnabled) scheduleNext();
        }

        function scheduleNext() {
            if (autoTimer) clearTimeout(autoTimer);
            autoTimer = setTimeout(refresh, REFRESH_INTERVAL);
        }

        function render(data) {
            const pill = $("conn-status");
            const info = $("agent-info");
            const summary = $("system-summary");
            const grid = $("processes-grid");

            if (!data.connected) {
                // Agent is not connected - show disconnected state
                // This is different from backend being unreachable (handled by overlay)
                pill.className = "status-pill disconnected";
                pill.textContent = t.t("status.disconnected");
                const sys = data.system || {};
                info.textContent = (sys.hostname || sys.ip_address)
                    ? `— ${fmt(sys.hostname)} · ${fmt(sys.ip_address)}`
                    : "— ?";
                summary.innerHTML = `<div class="empty">${escapeHtml(data.error || t.t("general.not_connected"))}</div>`;
                grid.innerHTML = "";
                t.translateAllElements();
                return;
            }

            pill.className = "status-pill connected";
            pill.textContent = t.t("status.connected");
            const s = data.system;
            info.textContent = `— ${fmt(s.hostname)} · ${fmt(s.ip_address)}`;
            summary.innerHTML = `
                <h2>${escapeHtml(s.name)} <span class="sub" style="color:var(--muted);font-weight:400;">v${fmt(s.version)}</span></h2>
                <div class="row"><span class="k" data-i18n="system.host">Host</span><span class="v">${fmt(s.hostname)}</span></div>
                <div class="row"><span class="k" data-i18n="system.ip_address">IP Address</span><span class="v">${fmt(s.ip_address)}</span></div>
                <div class="row"><span class="k" data-i18n="system.started">Started</span><span class="v">${fmt(s.start_time)}</span></div>
                <div class="row"><span class="k" data-i18n="system.configuration">Configuration</span><span class="v">${fmt(s.settings)}</span></div>
                <div class="card-actions">
                    <button class="danger" onclick="systemCmdConfirm('halt')">⏻ Halt</button>
                    <button class="danger" onclick="systemCmdConfirm('reboot')">⟲ Reboot</button>
                    <button onclick="systemCmdConfirm('navigation_restart')" title="Restart all processes">⟲ Restart App</button>
                    <button class="open-btn" onclick="showSettings('agent')" title="Agent settings">⚙ Agent Settings</button>
                    <button class="open-btn" onclick="showSettings('network')" title="Network settings">⚙ Network Settings</button>
                    <button class="open-btn" onclick="openNetwork()" style="margin-left: auto;">⚙ Network</button>
                </div>
            `;

            const procs = s.processes || [];
            if (!procs.length) {
                grid.innerHTML = `<div class="empty" data-i18n="main.no_processes">No processes registered.</div>`;
                t.translateAllElements();
                return;
            }
            // Filter and sort processes: filter out hidden processes unless showHidden is true, then sort by display_order (with name as tiebreaker for stability)
            const filtered = procs.filter(p => showHidden || p.hidden !== true);
            const ordered = filtered.slice().sort((a, b) => {
                const orderA = a.display_order !== undefined ? a.display_order : 0;
                const orderB = b.display_order !== undefined ? b.display_order : 0;
                if (orderA !== orderB) {
                    return orderA - orderB;
                }
                return a.name.localeCompare(b.name);
            });
            grid.innerHTML = ordered.map(procCard).join("");
            t.translateAllElements();
        }

        function procCard(p) {

            // Build service buttons from the services list

        // --- Console view ----------------------------------------------------
        async function openConsole(processName) {
            const win = createWindow('console', processName, `Console — ${processName}`, (w) => {
                if (w.timer) { clearTimeout(w.timer); w.timer = null; }
            });
            win.processName = processName;
            win.body.innerHTML = `<div class="empty">${t.t("general.loading")}</div>`;
            await refreshConsole(win);
        }

        async function refreshConsole(win) {
            if (!win || activeWindows.get(windowKey('console', win.processName)) !== win) return;
            const processName = win.processName;
            try {
                const d = await apiGet(`/api/console/${encodeURIComponent(processName)}/status`);
                if (activeWindows.get(windowKey('console', processName)) === win) {
                    renderConsole(d, processName, win.body);
                    win.timer = setTimeout(() => refreshConsole(win), REFRESH_INTERVAL);
                }
            } catch (e) {
                win.body.innerHTML = `<div class="empty">Erreur: ${escapeHtml(e.message)}</div>`;
                win.timer = setTimeout(() => refreshConsole(win), REFRESH_INTERVAL);
            }
        }

        function renderConsole(d, processName, body) {
            if (!d.ok) {
                body.innerHTML = `<div class="empty">${escapeHtml(d.error || "Erreur console")}</div>`;
                t.translateAllElements();
                return;
            }
            const servers = (d.servers || []).map(srv => {

            const couplers = (d.couplers || []).map(c => {

                const suspendResumeBtn = isRunning
                    ? `<button onclick="couplerCmd('${escapeHtml(processName)}','${escapeHtml(c.name)}','suspend')">⏸ Suspend</button>`
                    : (isSuspended
                        ? `<button onclick="couplerCmd('${escapeHtml(processName)}','${escapeHtml(c.name)}','resume')">▶ Resume</button>`
                        : `<button disabled>⏸ Suspend</button>`);
                const traceOn = c.trace_on === true;
                const traceBtn = traceOn
                    ? `<button onclick="couplerCmd('${escapeHtml(processName)}','${escapeHtml(c.name)}','stop_trace')">⏹ Stop trace</button>`
                    : `<button ${!isActive ? 'disabled' : ''} onclick="couplerCmd('${escapeHtml(processName)}','${escapeHtml(c.name)}','start_trace_raw')">⏵ Start trace</button>`;
                return `
                    <div class="card coupler-card">
                        <h2>
                            <span class="proc-name">${escapeHtml(c.name)}</span>
                            <span class="badge ${c.state}">${c.state}</span>
                        </h2>
                        <div class="row"><span class="k">Classe</span><span class="v">${fmt(c.coupler_class)}</span></div>
                        <div class="row"><span class="k">Protocole</span><span class="v">${fmt(c.protocol)}</span></div>
                        <div class="row"><span class="k" data-i18n="coupler.device_state">Device State</span><span class="v">${fmt(c.dev_state)}</span></div>
                        <div class="row"><span class="k" data-i18n="coupler.msg_in_out">Msg in/out</span><span class="v">${fmt(c.msg_in)} / ${fmt(c.msg_out)}</span></div>
                        <div class="row"><span class="k" data-i18n="coupler.rate_in_out">Rate in/out</span><span class="v">${fmt(c.input_rate && c.input_rate.toFixed(1))} / ${fmt(c.output_rate && c.output_rate.toFixed(1))} /s</span></div>
                        ${c.error ? `<div class="row"><span class="k">Erreur</span><span class="v" style="color:var(--red)">${fmt(c.error)}</span></div>` : ""}
                        ${c.status ? `<div class="row"><span class="k">Statut</span><span class="v">${fmt(c.status)}</span></div>` : ""}
                        <div class="row"><span class="k" data-i18n="coupler.trace">Trace</span><span class="v" style="color:${c.trace_on ? 'var(--green)' : 'var(--muted)'}" data-i18n-text="${c.trace_on ? 'coupler.activated' : 'coupler.inactive'}">${c.trace_on ? 'activated' : 'inactive'}</span></div>

            }).join("");

            body.innerHTML = `
                <div class="console-section">
                    <h3 data-i18n="console.servers">TCP/UDP Servers</h3> (${(d.servers||[]).length})

                <div class="console-section">
                    <h3 data-i18n="console.couplers">Couplers</h3> (${(d.couplers||[]).length})

                </div>
            `;
            t.translateAllElements();
        }

                    if (win) setTimeout(() => refreshConsole(win), 800);

            } catch (e) {
                toast(t.t("toast.error", {error: e.message}), false);
            }
        }

        // Log window management using createWindow system
        function openLog(processName) {
            const key = windowKey('log', processName);
            const existing = activeWindows.get(key);
            
            if (existing) {
                // Bring existing window to front
                existing.element.style.zIndex = ++windowZIndex;
                return;
            }

            const win = createWindow('log', processName, `Logs — ${processName}`, (win) => {
                // Cleanup when window closes
                stopLogStreamForWindow(win);
            });
            
            // Set larger default size for log windows
            win.element.style.width = '800px';
            win.element.style.height = '600px';

            // Create log window content
            const content = document.createElement('div');
            content.style.display = 'flex';
            content.style.flexDirection = 'column';
            content.style.height = '100%';
            content.style.gap = '12px';

            // Create controls
            const controls = document.createElement('div');
            controls.style.display = 'flex';
            controls.style.gap = '8px';
            controls.style.flexWrap = 'wrap';

            const startBtn = document.createElement('button');
            startBtn.textContent = '▶ Start';
            startBtn.title = 'Start';
            startBtn.id = `log-start-btn-${win.processName}`;

            const stopBtn = document.createElement('button');
            stopBtn.textContent = '■ Stop';
            stopBtn.title = 'Stop';
            stopBtn.disabled = true;
            stopBtn.id = `log-stop-btn-${win.processName}`;

            const clearBtn = document.createElement('button');
            clearBtn.textContent = '✓ Clear';
            clearBtn.title = 'Clear';
            clearBtn.id = `log-clear-btn-${win.processName}`;

            controls.appendChild(startBtn);
            controls.appendChild(stopBtn);
            controls.appendChild(clearBtn);

            // Create log body
            const logBody = document.createElement('div');
            logBody.className = 'log-content';
            logBody.id = `log-body-${win.processName}`;
            logBody.textContent = 'Click Start to start the log stream...';
            logBody.style.flex = '1';
            logBody.style.overflowY = 'auto';

            content.appendChild(controls);
            content.appendChild(logBody);

            win.body.appendChild(content);
            win.body.style.overflow = 'hidden';
            win.body.style.display = 'flex';
            win.body.style.flexDirection = 'column';

            // Store window-specific state
            win.logProcess = win.processName;
            win.logEventSource = null;

            // Setup button handlers
            startBtn.addEventListener('click', () => startLogStreamForWindow(win));
            stopBtn.addEventListener('click', () => stopLogStreamForWindow(win));
            clearBtn.addEventListener('click', () => clearLogForWindow(win));

            // Auto-start the stream
            startLogStreamForWindow(win);
        }

        function startLogStreamForWindow(win) {
            if (!win.logProcess) return;
            
            // Stop any existing stream
            if (win.logEventSource) {
                win.logEventSource.close();
                win.logEventSource = null;
            }

            const startBtn = document.getElementById(`log-start-btn-${win.processName}`);
            const stopBtn = document.getElementById(`log-stop-btn-${win.processName}`);
            
            if (startBtn) startBtn.disabled = true;
            if (stopBtn) stopBtn.disabled = false;

            win.logEventSource = new EventSource(`/api/log/stream/${encodeURIComponent(win.logProcess)}`);
            
            win.logEventSource.addEventListener("started", () => {
                appendLogLineForWindow(win, t.t("console.stream_started"));
            });
            
            win.logEventSource.addEventListener("error", (e) => {
                if (e.data) appendLogLineForWindow(win, "ERREUR: " + e.data);
                stopLogStreamForWindow(win);
            });
            
            win.logEventSource.onmessage = (e) => {
                appendLogLineForWindow(win, e.data);
            };
        }

        async function stopLogStreamForWindow(win) {
            if (win.logEventSource) {
                win.logEventSource.close();
                win.logEventSource = null;
            }

            const startBtn = document.getElementById(`log-start-btn-${win.processName}`);
            const stopBtn = document.getElementById(`log-stop-btn-${win.processName}`);
            
            if (startBtn) startBtn.disabled = false;
            if (stopBtn) stopBtn.disabled = true;
            
            appendLogLineForWindow(win, t.t("console.stream_stopped"));
            try {
                await apiPost(`/api/log/stop/${encodeURIComponent(win.logProcess)}`, {});
            } catch (e) { /* ignore */ }
        }

        function appendLogLineForWindow(win, line) {
            const logBody = document.getElementById(`log-body-${win.processName}`);
            if (logBody) {
                logBody.textContent += line + "\n";
                logBody.scrollTop = logBody.scrollHeight;
            }
        }

        function clearLogForWindow(win) {
            const logBody = document.getElementById(`log-body-${win.processName}`);
            if (logBody) {
                logBody.textContent = "";
            }
        }

            // This function is kept for backward compatibility but is no longer used

        }

        async function openNetwork() {

            try {
                const [status, configs, connections] = await Promise.all([
                    apiGet("/api/network/status"),
                    apiGet("/api/network/configurations"),
                    apiGet("/api/network/connections"),
                ]);
                renderNetwork(status, configs, connections);
            } catch (e) {
                $("network-body").innerHTML = `<div class="empty">Erreur: ${escapeHtml(e.message)}</div>`;
            }
        }

        function renderNetwork(status, configs, connections) {
            const body = $("network-body");
            if (!status.ok) {
                body.innerHTML = `<div class="empty">${escapeHtml(status.error || "Erreur")}</div>`;
                t.translateAllElements();
                return;
            }
            const connectionOptions = (connections.ok ? (connections.connections || []) : [])
                .map(c => `<option value="${escapeHtml(c.name)}">${escapeHtml(c.name)}</option>`).join("");
            
            const interfaces = (status.interfaces || []).map(iface => {
                const hasConnection = iface.connection_name && iface.connection_name !== "";
                const upDisabled = !hasConnection ? 'disabled' : '';
                const downDisabled = !hasConnection ? 'disabled' : '';
                const deleteDisabled = !hasConnection ? 'disabled' : '';
                return `
                <div class="net-interface">
                    <strong>${escapeHtml(iface.name)}</strong>
                    · ${escapeHtml(iface.type)}
                    · ${escapeHtml(iface.state)}
                    ${iface.function ? `· ${escapeHtml(iface.function)}` : ""}
                    ${iface.device_name ? `· ${escapeHtml(iface.device_name)}` : ""}
                    ${iface.connection_name ? `<br><span style="color:var(--muted)">Connexion: ${escapeHtml(iface.connection_name)}</span>` : ""}
                    <div class="card-actions">

        // YAML validation using js-yaml library (loaded from CDN)
        function validateYamlSyntax(content) {
            // Try using js-yaml if available
            if (typeof jsyaml !== 'undefined') {
                try {
                    jsyaml.load(content);
                    return null; // No error
                } catch (e) {
                    return `YAML syntax error: ${e.message}`;
                }
            }
            
            // Fallback to simple checks if js-yaml is not loaded
            return simpleYamlValidation(content);
        }

        function simpleYamlValidation(content) {
            // Basic YAML validation without js-yaml library
            const lines = content.split('\n');
            let indentLevel = -1;
            let inBlock = false;
            
            for (let i = 0; i < lines.length; i++) {
                const line = lines[i].trim();
                if (line === '' || line.startsWith('#')) continue;
                
                // Check for tabs (YAML spec requires spaces)
                if (line.includes('\t')) {
                    return 'YAML error: tabs are not allowed, use spaces for indentation';
                }
                
                // Check indentation
                const match = line.match(/^(\s*)/);
                const indent = match ? match[1].length : 0;
                
                if (indentLevel === -1) {
                    indentLevel = indent;
                } else if (indent > indentLevel) {
                    // Check that indentation increases by exactly 2 (common YAML standard)
                    if ((indent - indentLevel) % 2 !== 0) {
                        return 'YAML warning: indentation should increase by 2 spaces';
                    }
                }
            }
            
            return null; // No errors found with simple validation
        }

        function setupYamlValidation(target) {
            const win = activeWindows.get(windowKey('settings', target));
            const textarea = $(`settings-textarea-${target}`);
            
            if (!textarea && !win?.codemirrorEditor) return;
            
            // Debounced validation (don't validate on every keystroke)
            let validationTimeout = null;
            
            const validateContent = () => {
                const content = win?.codemirrorEditor ? win.codemirrorEditor.getValue() : textarea.value;
                const errorElement = $(`yaml-error-${target}`);
                const validationError = validateYamlSyntax(content);
                
                if (validationError) {
                    if (errorElement) {
                        errorElement.textContent = validationError;
                        errorElement.style.display = 'block';
                    }
                } else {
                    if (errorElement) {
                        errorElement.style.display = 'none';
                    }
                }
            };
            
            // Set up validation for textarea
            if (textarea) {
                textarea.addEventListener('input', () => {
                    clearTimeout(validationTimeout);
                    validationTimeout = setTimeout(validateContent, 500);
                });
            }
            
            // Set up validation for CodeMirror
            if (win?.codemirrorEditor) {
                win.codemirrorEditor.on('change', () => {
                    clearTimeout(validationTimeout);
                    validationTimeout = setTimeout(validateContent, 500);
                });
            }
        }

        function renderEngineDashboard(data, processName, win) {

            }
            const engine = engines.find(e => e.process === processName);
            if (!engine) {
                body.innerHTML = '<div class="empty" data-i18n="engine.no_engines">No engines found.</div>';
                t.translateAllElements();
                return;
            }
            const params = engine.parameters || {};
            win.headerTitle.textContent = `${escapeHtml(engine.label)} ${escapeHtml(engine.model)}`;
            const isRunning = engine.state === "ENGINE_RUNNING";
            const isOff = engine.state === "ENGINE_OFF";
            const speedPercent = isOff ? 0 : Math.min((engine.speed / (params.max_rpm || 1)) * 100, 100);
            const voltagePercent = isOff ? 0 : Math.min((engine.alternator_voltage / (params.voltage_scale || 1)) * 100, 100);
            const tempPercent = isOff ? 0 : Math.min((engine.temperature / (params.temperature_scale || 1)) * 100, 100);
            const voltageColor = isOff ? "var(--muted)" : "#55aaff";
            const tempColor = isOff ? "var(--muted)" : "#ff00ff";
            const stateSymbol = isRunning ? "▶️" : isOff ? "■" : "◆";
            const val = (v) => isOff ? "--" : fmt(v);
            // Tachometer: 270-degree arc from 7 o'clock (RPM=0) to 5 o'clock (100%),
            // with the bottom 90-degree gap neutralised in a distinct color. The green
            // arc represents the actual speed.
            const R = 45, C = 2 * Math.PI * R;        // circumference
            const ARC = C * (270 / 360);             // active 270deg arc length
            const GAP = C - ARC;                     // neutralised bottom gap
            const FILL = ARC * (speedPercent / 100);// green fill portion of the arc
            body.innerHTML = `
                <div class="engine-dashboard">
                    <div class="dashboard-row">
                        <div class="gauge-container">
                            <div class="gauge">
                                <svg viewBox="0 0 100 100" class="gauge-svg">
                                    <circle cx="50" cy="50" r="${R}" fill="none" stroke="var(--panel-2)" stroke-width="8" stroke-dasharray="${GAP} ${ARC}" transform="rotate(45 50 50)" />
                                    <circle cx="50" cy="50" r="${R}" fill="none" stroke="var(--border)" stroke-width="8" stroke-dasharray="${ARC} ${GAP}" transform="rotate(135 50 50)" />
                                    <circle cx="50" cy="50" r="${R}" fill="none" stroke="var(--green)" stroke-width="8" stroke-dasharray="${FILL} ${C}" transform="rotate(135 50 50)" />
                                    <text x="50" y="62" text-anchor="middle" font-size="15" fill="var(--text)">${val(engine.speed)}</text>
                                    <text x="50" y="78" text-anchor="middle" font-size="10" fill="var(--muted)">RPM</text>
                                </svg>
                            </div>
                        </div>
                        <div class="status-display">
                            <div class="status-icon" style="font-size: 3rem;">${stateSymbol}</div>
                            <div class="status-text">
                                <span class="badge ${engine.state}" data-i18n="engine.state_${engine.state.toLowerCase()}">${engine.state}</span>
                            </div>
                        </div>
                    </div>
                    <div class="dashboard-row">
                        <div class="bar-graph">
                            <div class="bar-label" data-i18n="engine.voltage">Voltage</div>
                            <div class="bar-container">
                                <div class="bar-fill" style="height: ${voltagePercent}%; background: ${voltageColor};"></div>
                            </div>
                            <div class="bar-value">${val(engine.alternator_voltage)} V</div>
                        </div>
                        <div class="bar-graph">
                            <div class="bar-label" data-i18n="engine.temperature">Temperature</div>
                            <div class="bar-container">
                                <div class="bar-fill" style="height: ${tempPercent}%; background: ${tempColor};"></div>
                            </div>
                            <div class="bar-value">${val(engine.temperature)} °C</div>
                        </div>
                        <div class="stats-box">
                            <div class="stat-row">
                                <span class="stat-label" data-i18n="engine.total_hours">Total Hours</span>
                                <span class="stat-value">${fmt(engine.total_hours)} h</span>
                            </div>
                            <div class="stat-row">
                                <span class="stat-label" data-i18n="engine.last_start">Last Start</span>
                                <span class="stat-value">${engine.last_start_time ? new Date(engine.last_start_time).toLocaleString() : "N/A"}</span>
                            </div>
                            <div class="stat-row">
                                <span class="stat-label" data-i18n="engine.last_stop">Last Stop</span>
                                <span class="stat-value">${engine.last_stop_time ? new Date(engine.last_stop_time).toLocaleString() : "N/A"}</span>

                    <div class="events-section">
                        <h3 style="display:flex; align-items:center; gap:12px;">
                            <span data-i18n="engine.history">History</span>
                            <div class="events-toggle ${win.eventsMode === 'events' ? 'mode-events' : ''}" id="engine-toggle-${escapeHtml(processName)}">
                                <span class="events-toggle-thumb"></span>
                                <input type="radio" name="events-mode-${escapeHtml(processName)}" id="events-runs-${escapeHtml(processName)}" ${win.eventsMode === 'runs' ? 'checked' : ''}>
                                <label for="events-runs-${escapeHtml(processName)}" data-i18n="engine.show_runs">Runs</label>
                                <input type="radio" name="events-mode-${escapeHtml(processName)}" id="events-events-${escapeHtml(processName)}" ${win.eventsMode === 'events' ? 'checked' : ''}>
                                <label for="events-events-${escapeHtml(processName)}" data-i18n="engine.show_events">Events</label>
                            </div>
                        </h3>
                        <div id="engine-events-${escapeHtml(processName)}" class="engine-events-list" data-process="${processName}" data-mode="${win.eventsMode || 'runs'}"><div class="empty" data-i18n="general.loading">Loading...</div></div>

                        <button class="open-btn" onclick="closeEngine('${escapeHtml(processName)}')" data-i18n="general.close">Close</button>
