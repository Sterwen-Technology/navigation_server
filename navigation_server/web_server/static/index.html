<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navigation Server — Web Interface</title>
    <!-- CodeMirror for YAML syntax highlighting -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.12/codemirror.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.12/theme/dracula.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.12/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.12/mode/yaml/yaml.min.js"></script>
    <link rel="stylesheet" href="css/main.css">
</head>
<body>
    <header>
        <h1>
            Navigation Server
            <span class="sub" id="agent-info">— agent: …</span>
        </h1>
        <div class="page-nav">
            <button id="nav-services" class="nav-btn active" onclick="showPage('services')" data-i18n="nav.services">Services</button>
            <!-- Les autres pages (ex: EMS) sont ajoutees dynamiquement par js/ui/framework.js depuis la configuration UI -->
        </div>
        <div class="actions">
            <span id="conn-status" class="status-pill disconnected">disconnected</span>
            <button id="refresh-btn" title="Refresh">⟳ <span id="last-refresh">—</span></button>
            <button id="toggle-hidden-btn" onclick="toggleHidden()" title="Toggle hidden processes">👁 <span id="show-hidden-text">Show Hidden</span></button>
            <label style="font-size:0.8rem; color:var(--muted); display:inline-flex; gap:4px; align-items:center;">
                <input type="checkbox" id="auto-refresh" checked> <span data-i18n="auto_refresh.label">Auto refresh (5s)</span>
            </label>
        </div>
    </header>
    <main>
        <div id="services-page" class="page active">
            <div id="system-summary" class="card" style="margin-bottom:16px;">
                <div class="empty" data-i18n="main.no_data">No data. Click ↻ to refresh.</div>
            </div>
            <div id="processes-grid" class="grid"></div>
        </div>
        <!-- Les pages configurees (ex: EMS) sont inserees ici par js/ui/framework.js -->
    </main>
    <div id="toast" class="toast"></div>
    <div id="window-container" class="window-container"></div>
    <div id="connection-lost-overlay" class="connection-lost-overlay" style="display: none;">
        <div class="connection-lost-message">
            <div data-i18n="error.connection_lost">Web server connection lost</div>
            <button onclick="retryConnection()" style="margin-top: 15px; background: var(--accent); color: #0f172a;" data-i18n="button.retry">Retry Connection</button>
        </div>
    </div>


    <div id="network-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 data-i18n="network.title">Network Configuration</h2>
                <button class="modal-close" onclick="closeNetwork()" title="Close">&times;</button>
            </div>
            <div id="network-body"><div class="empty" data-i18n="general.loading">Loading...</div></div>
        </div>
    </div>

    <!-- Login overlay: shown only when the backend reports auth required (401) -->
    <div id="login-overlay" class="modal">
        <div class="login-card">
            <h2 data-i18n="auth.title">Sign in</h2>
            <form id="login-form" autocomplete="on">
                <label for="login-username" data-i18n="auth.username">Username</label>
                <input id="login-username" name="username" type="text" required autocomplete="username" autofocus>
                <label for="login-password" data-i18n="auth.password">Password</label>
                <input id="login-password" name="password" type="password" required autocomplete="current-password">
                <div id="login-error" class="login-error"></div>
                <button type="submit" id="login-submit" data-i18n="auth.signin">Sign in</button>
            </form>
        </div>
    </div>

    <script src="translations.js"></script>
    <script type="module" src="js/app.js"></script>

</body>
</html>
