<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navigation Server — Web Interface</title>
    <style>
        :root {
            --bg: #0f172a;
            --panel: #1e293b;
            --panel-2: #334155;
            --text: #e2e8f0;
            --muted: #94a3b8;
            --accent: #38bdf8;
            --green: #22c55e;
            --red: #ef4444;
            --amber: #f59e0b;
            --border: #475569;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.5;
        }
        header {
            background: linear-gradient(90deg, #1e293b, #0f172a);
            border-bottom: 1px solid var(--border);
            padding: 16px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
        }
        header h1 {
            margin: 0;
            font-size: 1.25rem;
            font-weight: 600;
        }
        header h1 .sub { color: var(--muted); font-weight: 400; font-size: 0.85rem; }
        .status-pill {
            padding: 4px 12px;
            border-radius: 999px;
            font-size: 0.8rem;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .status-pill.connected { background: rgba(34,197,94,0.15); color: var(--green); }
        .status-pill.disconnected { background: rgba(239,68,68,0.15); color: var(--red); }
        .status-pill::before {
            content: "";
            width: 8px; height: 8px;
            border-radius: 50%;
            background: currentColor;
        }
        .actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
        button {
            background: var(--panel-2);
            color: var(--text);
            border: 1px solid var(--border);
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: background 0.15s;
        }
        button:hover:not(:disabled) { background: var(--accent); color: #0f172a; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        button.danger:hover:not(:disabled) { background: var(--red); color: white; }
        main { padding: 24px; max-width: 1400px; margin: 0 auto; }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
            gap: 16px;
        }
        .card {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 16px;
            overflow: hidden;
        }
        .card h2 {
            margin: 0 0 12px 0;
            font-size: 1rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
        }
        .card h2 .proc-name { color: var(--accent); }
        .badge {
            font-size: 0.7rem;
            padding: 2px 8px;
            border-radius: 999px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.03em;
        }
        .badge.RUNNING { background: rgba(34,197,94,0.15); color: var(--green); }
        .badge.STOPPED { background: rgba(239,68,68,0.15); color: var(--red); }
        .badge.NOT_STARTED { background: rgba(148,163,184,0.15); color: var(--muted); }
        .row { display: flex; justify-content: space-between; padding: 3px 0; font-size: 0.82rem; }
        .row .k { color: var(--muted); }
        .row .v { font-family: ui-monospace, "SFMono-Regular", monospace; }
        /* Engine Dashboard Styles */
        .engine-dashboard { max-width: 1000px; }
        .dashboard-row { display: flex; gap: 30px; flex-wrap: wrap; margin-bottom: 20px; }
        .gauge-container { flex: 1; min-width: 200px; display: flex; justify-content: center; }
        .gauge { text-align: center; }
        .gauge-svg { width: 100%; height: auto; max-width: 200px; }
        .status-display { flex: 1; min-width: 180px; max-width: 220px; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .status-icon { margin-bottom: 10px; }
        /* Engine events mode sliding toggle */
        .events-toggle { position: relative; display: inline-flex; border: 1px solid var(--border); border-radius: 999px; overflow: hidden; }
        .events-toggle input { position: absolute; opacity: 0; width: 0; height: 0; }
        .events-toggle label { padding: 4px 14px; font-size: 0.78rem; cursor: pointer; color: var(--muted); user-select: none; transition: color 0.15s; }
        .events-toggle input:checked + label { color: var(--text); }
        .events-toggle .events-toggle-thumb { position: absolute; top: 2px; bottom: 2px; left: 2px; width: calc(50% - 4px); border-radius: 999px; background: var(--accent); opacity: 0.25; transition: transform 0.2s ease; pointer-events: none; }
        .events-toggle.mode-events .events-toggle-thumb { transform: translateX(100%); }
        .stats-box { flex: 1; min-width: 200px; max-width: 280px; background: var(--panel-2); border-radius: 8px; padding: 12px; }
        .stat-row { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid var(--border); }
        .stat-row:last-child { border-bottom: none; }
        .bar-graph { flex: 1; min-width: 60px; max-width: 80px; }
        .bar-label { font-size: 0.8rem; color: var(--muted); margin-bottom: 4px; }
        .bar-container { height: 150px; background: var(--panel-2); border-radius: 4px; overflow: hidden; position: relative; display: flex; flex-direction: column; justify-content: flex-end; }
        .bar-fill { width: 100%; transition: height 0.3s ease; border-radius: 4px; }
        .bar-value { font-size: 0.8rem; text-align: center; margin-top: 4px; font-family: ui-monospace, monospace; }
        .stat-row:last-child { border-bottom: none; }
        .stat-label { color: var(--muted); font-size: 0.85rem; }
        .stat-value { color: var(--text); font-family: ui-monospace, monospace; font-size: 0.85rem; white-space: nowrap; }
        .events-section { margin-top: 20px; border-top: 1px solid var(--border); padding-top: 16px; }
        .runs-list { margin-top: 8px; }
        .engine-events-list { max-height: 240px; overflow-y: auto; border: 1px solid var(--border); border-radius: 4px; padding: 0 8px; }
        .run-header, .run-row, .event-header, .event-row { display: grid; grid-template-columns: 2fr 1fr 1fr 1fr; gap: 12px; padding: 6px 0; font-size: 0.85rem; }
        .event-header { color: var(--muted); border-bottom: 1px solid var(--border); padding-bottom: 6px; }
        .event-row { border-bottom: 1px solid var(--border); }
        .event-row:last-child { border-bottom: none; }
        .open-btn.compact { padding: 2px 8px; font-size: 0.75em; }
        .run-header { color: var(--muted); border-bottom: 1px solid var(--border); padding-bottom: 6px; }
        .run-row { border-bottom: 1px solid var(--border); }
        .run-row:last-child { border-bottom: none; }
        .servers { margin-top: 10px; border-top: 1px solid var(--border); padding-top: 8px; }
        .server-item { font-size: 0.78rem; padding: 4px 0; color: var(--muted); }
        .server-item strong { color: var(--text); }
        .card-actions { display: flex; gap: 6px; margin-top: 12px; flex-wrap: wrap; }
        .card-actions button { padding: 4px 10px; font-size: 0.78rem; }
        .empty { color: var(--muted); text-align: center; padding: 48px 0; }
        .refresh-spin { animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .toast {
            position: fixed; bottom: 24px; right: 24px;
            background: var(--panel-2);
            border: 1px solid var(--border);
            padding: 12px 16px; border-radius: 8px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.4);
            max-width: 360px; font-size: 0.85rem;
            opacity: 0; transform: translateY(10px);
            transition: opacity 0.2s, transform 0.2s;
            z-index: 100;
        }
        .toast.show { opacity: 1; transform: translateY(0); }
        .toast.ok { border-left: 4px solid var(--green); }
        .toast.err { border-left: 4px solid var(--red); }
        button.open-btn { background: rgba(56,189,248,0.15); color: var(--accent); border-color: var(--accent); }
        button.open-btn:hover:not(:disabled) { background: var(--accent); color: #0f172a; }
        /* Window System */
        .window-container {
            position: fixed; inset: 0; pointer-events: none; z-index: 1000;
        }
        .service-window {
            position: absolute; background: var(--panel); border: 1px solid var(--border);
            border-radius: 8px; box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            min-width: 300px; min-height: 200px; max-width: 90vw; max-height: 80vh;
            overflow: hidden; display: flex; flex-direction: column;
            pointer-events: auto; cursor: default;
        }
        .window-header {
            display: flex; align-items: center; justify-content: space-between;
            padding: 8px 12px; background: var(--panel-2); border-bottom: 1px solid var(--border);
            cursor: move; user-select: none;
        }
        .window-header h2 { margin: 0; font-size: 0.95rem; color: var(--text); }
        .window-title-bar {
            display: flex; align-items: center; gap: 8px; flex: 1;
        }
        .window-controls {
            display: flex; gap: 4px;
        }
        .window-btn {
            background: none; border: none; color: var(--muted);
            font-size: 0.8rem; cursor: pointer; padding: 2px 6px;
            border-radius: 3px;
        }
        .window-btn:hover { background: var(--border); color: var(--text); }
        .window-btn.minimize:before { content: "_"; }
        .window-btn.close:before { content: "\d7"; }
        .window-body {
            flex: 1; overflow: auto; padding: 16px;
        }
        .window-content {
            max-width: 100%; max-height: 100%;
        }
        .window-resize-handle {
            position: absolute; right: 0; bottom: 0; width: 12px; height: 12px;
            background: var(--accent); cursor: nwse-resize; z-index: 10;
            border-radius: 0 0 4px 0;
        }
        /* Legacy modal support (backward compatibility) */
        .modal {
            display: none; position: fixed; inset: 0;
            background: rgba(0,0,0,0.6);
            z-index: 50; padding: 24px;
            overflow-y: auto;
        }
        .modal.show { display: block; }
        .modal-content {
            background: var(--bg); border: 1px solid var(--border);
            border-radius: 12px; max-width: 1200px; margin: 0 auto;
            padding: 24px; min-height: 200px;
        }
        .modal-header {
            display: flex; align-items: center; justify-content: space-between;
            margin-bottom: 16px; border-bottom: 1px solid var(--border); padding-bottom: 12px;
        }
        .modal-header h2 { margin: 0; font-size: 1.1rem; color: var(--accent); }
        .modal-close {
            background: none; border: none; color: var(--muted);
            font-size: 1.5rem; cursor: pointer; padding: 0 8px;
        }
        .modal-close:hover { color: var(--text); }
        .console-section { margin-bottom: 24px; }
        .console-section h3 {
            font-size: 0.95rem; color: var(--muted); margin: 0 0 12px 0;
            border-bottom: 1px solid var(--border); padding-bottom: 6px;
        }
        .console-server {
            background: var(--panel); border-radius: 8px; padding: 10px 12px;
            margin-bottom: 8px; font-size: 0.82rem;
        }
        .coupler-card { padding: 12px; }
        .secure-badge { font-size: 0.75rem; color: var(--green); margin-left: 4px; }
        .log-content {
            background: #0b1120; border: 1px solid var(--border);
            border-radius: 6px; padding: 12px; font-family: ui-monospace, monospace;
            font-size: 0.78rem; max-height: 60vh; overflow-y: auto;
            white-space: pre-wrap; word-break: break-all; color: #cbd5e1;
        }
        .net-interface {
            background: var(--panel); border-radius: 8px; padding: 10px 12px;
            margin-bottom: 8px; font-size: 0.82rem;
        }
        .net-config-select {
            background: var(--panel-2); color: var(--text); border: 1px solid var(--border);
            padding: 6px 10px; border-radius: 6px; font-size: 0.82rem; margin-left: 8px;
        }
            .proxy-symbol { display: inline-block; width: 1em; text-align: center; }
        .proxy-symbol::after { content: "◆"; font-size: 0.8em; }
        .nmea2000-device { padding: 8px 12px; border-bottom: 1px solid var(--border); }
        .nmea2000-device:last-child { border-bottom: none; }
        .pgn-stats { font-family: ui-monospace, monospace; font-size: 0.8em; margin-top: 4px; }
        .pgn-stats .pgn-item { display: inline-block; margin-right: 12px; }
        .pgn-stats .pgn-item .pgn { color: var(--accent); }
        .pgn-stats .pgn-item .count { color: var(--muted); }
        .pgn-def { font-size: 0.85em; color: var(--muted); margin-top: 6px; }
        .nmea2000-devices { max-height: 400px; overflow-y: auto; }
        .nmea2000-device { display: flex; align-items: center; gap: 8px; padding: 6px 12px; border-bottom: 1px solid var(--border); font-size: 0.85em; }
        .nmea2000-device:last-child { border-bottom: none; }
        .dev-addr { font-family: ui-monospace, monospace; color: var(--accent); min-width: 40px; }
        .dev-mfg { color: var(--muted); flex: 1; }
        .dev-prod { color: var(--text); flex: 2; }
        .open-btn.compact { padding: 2px 8px; font-size: 0.75em; }
        .row { display: flex; gap: 12px; flex-wrap: wrap; }
        .row .k { color: var(--muted); }
        .row .v { color: var(--text); }
        .pgn-list { margin-top: 8px; }
        .pgn-list h4 { margin: 4px 0; font-size: 0.85em; color: var(--muted); }
        .pgn-items { max-height: 200px; overflow-y: auto; border: 1px solid var(--border); border-radius: 4px; padding: 4px; }
        .pgn-item { display: flex; gap: 8px; padding: 2px 4px; font-size: 0.8em; border-bottom: 1px solid var(--border-light); }
        .pgn-item:last-child { border-bottom: none; }
        .pgn-num { font-family: ui-monospace, monospace; color: var(--accent); min-width: 50px; text-align: right; }
        .pgn-desc { flex: 2; color: var(--text); }
        .pgn-count { font-family: ui-monospace, monospace; color: var(--muted); min-width: 40px; text-align: right; }
</style>
</head>
<body>
    <header>
        <h1>
            Navigation Server
            <span class="sub" id="agent-info">— agent: …</span>
        </h1>
        <div class="actions">
            <span id="conn-status" class="status-pill disconnected">disconnected</span>
            <button id="refresh-btn" title="Refresh">⟳ <span id="last-refresh">—</span></button>
            <label style="font-size:0.8rem; color:var(--muted); display:inline-flex; gap:4px; align-items:center;">
                <input type="checkbox" id="auto-refresh" checked> <span data-i18n="auto_refresh.label">Auto refresh (5s)</span>
            </label>
        </div>
    </header>
    <main>
        <div id="system-summary" class="card" style="margin-bottom:16px;">
            <div class="empty" data-i18n="main.no_data">No data. Click ↻ to refresh.</div>
        </div>
        <div id="processes-grid" class="grid"></div>
    </main>
    <div id="toast" class="toast"></div>
    <div id="window-container" class="window-container"></div>

    <div id="log-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="log-title">Logs</h2>
                <div>
                    <button id="log-start-btn" onclick="startLogStream()" title="Start">▶ Start</button>
                    <button id="log-stop-btn" onclick="stopLogStream()" title="Stop" disabled>■ Stop</button>
                    <button class="modal-close" onclick="closeLog()" title="Close">&times;</button>
                </div>
            </div>
            <div id="log-body" class="log-content" data-i18n="console.start_stream">Click Start to start the log stream...</div>
        </div>
    </div>

    <div id="network-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 data-i18n="network.title">Network Configuration</h2>
                <button class="modal-close" onclick="closeNetwork()" title="Close">&times;</button>
            </div>
            <div id="network-body"><div class="empty" data-i18n="general.loading">Loading...</div></div>
        </div>
    </div>

    <script src="translations.js"></script>
<script>
        const REFRESH_INTERVAL = 5000;
        let autoTimer = null;
        let isRefreshing = false;
        let autoEnabled = true;

        // Window Management System
        let windowZIndex = 1000;
        let activeWindows = new Map(); // windowKey -> {element, body, header, processName, serviceType, cleanup}
        let isDragging = null;
        let dragOffset = {x: 0, y: 0};
        let nextWindowPos = {x: 80, y: 80};

        const $ = (id) => document.getElementById(id);

        function windowKey(serviceType, processName) {
            return `${serviceType}:${processName}`;
        }

        // Window Management Functions
        // If a single-instance window for (serviceType, processName) is already
        // open, bring it to the front and return its record; otherwise null.
        function focusWindow(serviceType, processName) {
            const key = windowKey(serviceType, processName);
            const win = activeWindows.get(key);
            if (win) {
                win.element.style.zIndex = ++windowZIndex;
                return win;
            }
            return null;
        }

        // Creates an independent, draggable service window. Only one window per
        // (serviceType, processName) exists at a time: calling createWindow again
        // for an open service reuses that window. `onClose` (optional) is invoked
        // when the window closes so callers stop refresh timers.
        function createWindow(serviceType, processName, title, onClose) {
            const existing = focusWindow(serviceType, processName);
            if (existing) {
                existing.headerTitle.textContent = title;
                return existing;
            }

            const key = windowKey(serviceType, processName);
            const windowEl = document.createElement('div');
            windowEl.className = 'service-window';
            const pos = nextWindowPos;
            windowEl.style.left = pos.x + 'px';
            windowEl.style.top = pos.y + 'px';
            windowEl.style.width = '520px';
            windowEl.style.zIndex = ++windowZIndex;
            pos.x = (pos.x + 28) % (window.innerWidth - 560);
            pos.y = (pos.y + 28) % (window.innerHeight - 260);

            const headerEl = document.createElement('div');
            headerEl.className = 'window-header';
            headerEl.innerHTML = `
                <div class="window-title-bar">
                    <h2></h2>
                </div>
                <div class="window-controls">
                    <button class="window-btn minimize" title="Minimize"></button>
                    <button class="window-btn close" title="Close"></button>
                </div>
            `;
            const headerTitle = headerEl.querySelector('h2');
            headerTitle.textContent = title;

            const bodyEl = document.createElement('div');
            bodyEl.className = 'window-body';

            const resizeHandle = document.createElement('div');
            resizeHandle.className = 'window-resize-handle';

            windowEl.appendChild(headerEl);
            windowEl.appendChild(bodyEl);
            windowEl.appendChild(resizeHandle);
            $("window-container").appendChild(windowEl);

            const record = {
                element: windowEl,
                body: bodyEl,
                header: headerEl,
                headerTitle: headerTitle,
                processName: processName,
                serviceType: serviceType,
                cleanup: null,
                _onClose: onClose || null
            };

            headerEl.querySelector('.window-btn.minimize').addEventListener('click', (e) => {
                e.stopPropagation();
                minimizeWindow(key);
            });
            headerEl.querySelector('.window-btn.close').addEventListener('click', (e) => {
                e.stopPropagation();
                closeWindow(key);
            });

            windowEl.addEventListener('mousedown', () => {
                windowEl.style.zIndex = ++windowZIndex;
            });

            makeDraggable(windowEl, headerEl);
            makeResizable(windowEl, resizeHandle);

            activeWindows.set(key, record);
            return record;
        }

        function closeWindow(key) {
            const win = activeWindows.get(key);
            if (!win) return;
            if (win._onClose) {
                try { win._onClose(win); } catch (e) { console.error('window cleanup error', e); }
            }
            if (win.cleanup) {
                try { win.cleanup(); } catch (e) { console.error('window cleanup error', e); }
            }
            win.element.remove();
            activeWindows.delete(key);
        }

        function minimizeWindow(key) {
            const win = activeWindows.get(key);
            if (!win) return;
            const body = win.body;
            body.style.display = body.style.display === 'none' ? '' : 'none';
        }

        function makeDraggable(element, handle) {
            handle.addEventListener('mousedown', (e) => {
                if (e.target.classList.contains('window-btn') || e.target.tagName === 'BUTTON') {
                    return; // Don't drag when clicking buttons
                }
                isDragging = element;
                dragOffset.x = e.clientX - element.getBoundingClientRect().left;
                dragOffset.y = e.clientY - element.getBoundingClientRect().top;
                element.style.cursor = 'move';
                e.preventDefault();
            });
        }

        function makeResizable(element, handle) {
            let resizing = null;
            let start = {x: 0, y: 0, w: 0, h: 0};
            const onMove = (e) => {
                if (!resizing) return;
                resizing.style.width = Math.max(300, start.w + (e.clientX - start.x)) + 'px';
                resizing.style.height = Math.max(200, start.h + (e.clientY - start.y)) + 'px';
            };
            const onUp = () => {
                if (!resizing) return;
                resizing = null;
                document.removeEventListener('mousemove', onMove);
                document.removeEventListener('mouseup', onUp);
            };
            handle.addEventListener('mousedown', (e) => {
                e.preventDefault();
                e.stopPropagation();
                resizing = element;
                const rect = element.getBoundingClientRect();
                start = {x: e.clientX, y: e.clientY, w: rect.width, h: rect.height};
                document.addEventListener('mousemove', onMove);
                document.addEventListener('mouseup', onUp);
            });
        }

        document.addEventListener('mousemove', (e) => {
            if (isDragging) {
                isDragging.style.left = (e.clientX - dragOffset.x) + 'px';
                isDragging.style.top = (e.clientY - dragOffset.y) + 'px';
            }
        });

        document.addEventListener('mouseup', () => {
            if (isDragging) {
                isDragging.style.cursor = '';
                isDragging = null;
            }
        });

        function toast(msg, ok = true) {
            const toastEl = $("toast");
            toastEl.textContent = msg;
            toastEl.className = "toast show " + (ok ? "ok" : "err");
            setTimeout(() => toastEl.classList.remove("show"), 3500);
        }

        async function apiGet(path) {
            const r = await fetch(path, { cache: "no-store" });
            if (!r.ok) throw new Error(`HTTP ${r.status}`);
            return r.json();
        }

        async function apiPost(path, body) {
            const r = await fetch(path, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(body),
            });
            return r.json();
        }

        function escapeHtml(s) {
            return String(s ?? "").replace(/[&<>"']/g, c => ({
                "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
            }[c]));
        }

        function fmt(v) { return v === 0 || v ? escapeHtml(v) : "—"; }

        async function refresh() {
            if (isRefreshing) return;
            isRefreshing = true;
            const btn = $("refresh-btn");
            btn.disabled = true;
            try {
                const data = await apiGet("/api/status");
                render(data);
                $("last-refresh").textContent = new Date().toLocaleTimeString("fr-FR");
            } catch (e) {
                toast(t.t("toast.refresh_error", {error: e.message}), false);
            } finally {
                isRefreshing = false;
                btn.disabled = false;
            }
            // Schedule the next refresh if auto is enabled (recursive timer
            // avoids piling up calls when a request takes longer than the
            // interval).
            if (autoEnabled) scheduleNext();
        }

        function scheduleNext() {
            if (autoTimer) clearTimeout(autoTimer);
            autoTimer = setTimeout(refresh, REFRESH_INTERVAL);
        }

        function render(data) {
            const pill = $("conn-status");
            const info = $("agent-info");
            const summary = $("system-summary");
            const grid = $("processes-grid");

            if (!data.connected) {
                pill.className = "status-pill disconnected";
                pill.textContent = t.t("status.disconnected");
                info.textContent = data.agent_address ? `— agent: ${data.agent_address}` : "— agent: ?";
                summary.innerHTML = `<div class="empty">${escapeHtml(data.error || t.t("general.not_connected"))}</div>`;
                grid.innerHTML = "";
                t.translateAllElements();
                return;
            }

            pill.className = "status-pill connected";
            pill.textContent = t.t("status.connected");
            info.textContent = `— agent: ${data.agent_address}`;

            const s = data.system;
            summary.innerHTML = `
                <h2>${escapeHtml(s.name)} <span class="sub" style="color:var(--muted);font-weight:400;">v${fmt(s.version)}</span></h2>
                <div class="row"><span class="k" data-i18n="system.host">Host</span><span class="v">${fmt(s.hostname)}</span></div>
                <div class="row"><span class="k" data-i18n="system.ip_address">IP Address</span><span class="v">${fmt(s.ip_address)}</span></div>
                <div class="row"><span class="k" data-i18n="system.started">Started</span><span class="v">${fmt(s.start_time)}</span></div>
                <div class="row"><span class="k" data-i18n="system.configuration">Configuration</span><span class="v">${fmt(s.settings)}</span></div>
                <div class="card-actions">
                    <button class="danger" onclick="systemCmdConfirm('halt')">⏻ Halt</button>
                    <button class="danger" onclick="systemCmdConfirm('reboot')">⟲ Reboot</button>
                    <button onclick="systemCmdConfirm('navigation_restart')" title="Restart all processes">⟲ Restart App</button>
                    <button class="open-btn" onclick="openNetwork()" style="margin-left: auto;">⚙ Network</button>
                </div>
            `;

            const procs = s.processes || [];
            if (!procs.length) {
                grid.innerHTML = `<div class="empty" data-i18n="main.no_processes">No processes registered.</div>`;
                t.translateAllElements();
                return;
            }
            grid.innerHTML = procs.map(procCard).join("");
            t.translateAllElements();
        }

        function procCard(p) {
            const servers = (p.servers || []).map(srv => `
                <div class="server-item">
                    <strong>${escapeHtml(srv.name)}</strong> [${escapeHtml(srv.server_class)}]
                    ${srv.running ? '\u00b7 <span style="color:var(--green)">running</span>' : '\u00b7 <span style="color:var(--red)">stopped</span>'}
                    ${srv.port ? `\u00b7 port ${srv.port}` : ""}
                    ${srv.protocol ? `\u00b7 ${escapeHtml(srv.protocol)}` : ""}
                    ${srv.nb_connections ? `\u00b7 ${srv.nb_connections} conn.` : ""}
                </div>
            `).join("");
            // Contextual action buttons based on process state.
            const isRunning = p.state === "RUNNING";
            const startBtn = `<button ${isRunning ? 'disabled' : ''} onclick="procCmd('${escapeHtml(p.name)}','start')">\u25b6 Start</button>`;
            const stopBtn = `<button ${!isRunning ? 'disabled' : ''} onclick="procCmd('${escapeHtml(p.name)}','stop')">\u25a0 Stop</button>`;
            const restartBtn = `<button ${!isRunning ? 'disabled' : ''} onclick="procCmd('${escapeHtml(p.name)}','restart')">\u27f2 Restart</button>`;
            const logBtn = p.is_systemd
                ? `<button onclick="openLog('${escapeHtml(p.name)}')">\ud83d\udccb Log</button>`
                : '';
            
            // Build service buttons from the services list
            const serviceButtons = [];
            const services = p.services || [];
            for (const svc of services) {
                const rpcService = svc.rpc_service || '';
                const svcName = svc.service_name || '';
                if (rpcService === 'NavigationConsole') {
                    serviceButtons.push(`<button class="open-btn" onclick="openConsole('${escapeHtml(p.name)}')">\u2913 Console</button>`);
                } else if (rpcService === 'Nmea2000ControllerService') {
                    serviceButtons.push(`<button class="open-btn" onclick="openNmea2000('${escapeHtml(p.name)}')">\u2699 NMEA2000</button>`);
                } else if (rpcService === 'EngineData') {
                    serviceButtons.push(`<button class="open-btn" onclick="openEngineData('${escapeHtml(p.name)}')">\u26a1 Engine</button>`);
                }
            }
            
            return `
                <div class="card">
                    <h2>
                        <span class="proc-name">${escapeHtml(p.name)}</span>
                        ${p.secure_grpc ? '<span class="secure-badge" title="TLS">\ud83d\udd12</span>' : ''}
                        <span class="badge ${p.state}">${p.state}</span>
                    </h2>
                    <div class="row"><span class="k">PID</span><span class="v">${fmt(p.pid)}</span></div>
                    <div class="row"><span class="k">Port gRPC</span><span class="v">${fmt(p.grpc_port)}</span></div>
                    <div class="row"><span class="k">Version</span><span class="v">${fmt(p.version)}</span></div>
                    <div class="row"><span class="k" data-i18n="process.started">Started</span><span class="v">${fmt(p.start_time)}</span></div>
                    ${p.status ? `<div class="row"><span class="k" data-i18n="process.status">Status</span><span class="v">${fmt(p.status)}</span></div>` : ""}
                    ${p.error ? `<div class="row"><span class="k" data-i18n="process.error">Error</span><span class="v" style="color:var(--red)">${fmt(p.error)}</span></div>` : ""}

                    ${p.is_systemd ? '<div class="row"><span class="k" data-i18n="process.control">Control</span><span class="v" data-i18n="process.systemd">systemd</span></div>' : ""}
                    ${servers ? `<div class="servers">${servers}</div>` : ""}
                    <div class="card-actions">
                        ${startBtn}
                        ${stopBtn}
                        ${restartBtn}
                        ${logBtn}
                    </div>
                    ${serviceButtons.length > 0 ? `<div class="card-actions">${serviceButtons.join('')}</div>` : ''}
                </div>
            `;
            t.translateAllElements();
        }
        async function procCmd(target, cmd) {
            try {
                const r = await apiPost("/api/process", { target, cmd });
                toast(`${cmd} ${target}: ${r.ok ? "OK" : (r.error || t.t("toast.failure"))}`, r.ok);
                if (r.ok) setTimeout(refresh, 800);
            } catch (e) {
                toast(t.t("toast.error", {error: e.message}), false);
            }
        }

        async function systemCmd(cmd) {
            try {
                const r = await apiPost("/api/system", { cmd });
                toast(`${cmd}: ${r.ok ? "OK" : (r.error || t.t("toast.failure"))}`, r.ok);
                if (r.ok) setTimeout(refresh, 800);
            } catch (e) {
                toast(t.t("toast.error", {error: e.message}), false);
            }
        }

        // --- Console view ----------------------------------------------------
        async function openConsole(processName) {
            const win = createWindow('console', processName, `Console — ${processName}`, (w) => {
                if (w.timer) { clearTimeout(w.timer); w.timer = null; }
            });
            win.processName = processName;
            win.body.innerHTML = `<div class="empty">${t.t("general.loading")}</div>`;
            await refreshConsole(win);
        }

        async function refreshConsole(win) {
            if (!win || activeWindows.get(windowKey('console', win.processName)) !== win) return;
            const processName = win.processName;
            try {
                const d = await apiGet(`/api/console/${encodeURIComponent(processName)}`);
                if (activeWindows.get(windowKey('console', processName)) === win) {
                    renderConsole(d, processName, win.body);
                    win.timer = setTimeout(() => refreshConsole(win), REFRESH_INTERVAL);
                }
            } catch (e) {
                win.body.innerHTML = `<div class="empty">Erreur: ${escapeHtml(e.message)}</div>`;
                win.timer = setTimeout(() => refreshConsole(win), REFRESH_INTERVAL);
            }
        }

        function renderConsole(d, processName, body) {
            if (!d.ok) {
                body.innerHTML = `<div class="empty">${escapeHtml(d.error || "Erreur console")}</div>`;
                t.translateAllElements();
                return;
            }
            const servers = (d.servers || []).map(srv => {
                const conns = (srv.connections || []).map(c => `
                    <div class="server-item">
                        ${escapeHtml(c.remote_ip)}:${fmt(c.remote_port)}
                        · ${fmt(c.total_msg)} msg · ${fmt(c.msg_rate && c.msg_rate.toFixed(1))}/s
                    </div>
                `).join("");
                return `
                    <div class="console-server">
                        <strong>${escapeHtml(srv.name)}</strong> [${escapeHtml(srv.server_class)}]
                        ${srv.running ? '· <span style="color:var(--green)">running</span>' : '· <span style="color:var(--red)">stopped</span>'}
                        ${srv.port ? `· port ${srv.port}` : ""}
                        ${srv.protocol ? `· ${escapeHtml(srv.protocol)}` : ""}
                        ${srv.nb_connections ? `· ${srv.nb_connections} conn.` : ""}
                        ${conns ? `<div class="servers">${conns}</div>` : ""}
                    </div>
                `;
            }).join("");

            const couplers = (d.couplers || []).map(c => {
                const state = c.state;
                const isRunning = state === "RUNNING";
                const isSuspended = state === "SUSPENDED";
                const isActive = isRunning || isSuspended;
                const startStopBtn = isActive
                    ? `<button onclick="couplerCmd('${escapeHtml(processName)}','${escapeHtml(c.name)}','stop')">■ Stop</button>`
                    : `<button onclick="couplerCmd('${escapeHtml(processName)}','${escapeHtml(c.name)}','start')">▶ Start</button>`;
                const suspendResumeBtn = isRunning
                    ? `<button onclick="couplerCmd('${escapeHtml(processName)}','${escapeHtml(c.name)}','suspend')">⏸ Suspend</button>`
                    : (isSuspended
                        ? `<button onclick="couplerCmd('${escapeHtml(processName)}','${escapeHtml(c.name)}','resume')">▶ Resume</button>`
                        : `<button disabled>⏸ Suspend</button>`);
                const traceOn = c.trace_on === true;
                const traceBtn = traceOn
                    ? `<button onclick="couplerCmd('${escapeHtml(processName)}','${escapeHtml(c.name)}','stop_trace')">⏹ Stop trace</button>`
                    : `<button ${!isActive ? 'disabled' : ''} onclick="couplerCmd('${escapeHtml(processName)}','${escapeHtml(c.name)}','start_trace_raw')">⏵ Start trace</button>`;
                return `
                    <div class="card coupler-card">
                        <h2>
                            <span class="proc-name">${escapeHtml(c.name)}</span>
                            <span class="badge ${c.state}">${c.state}</span>
                        </h2>
                        <div class="row"><span class="k">Classe</span><span class="v">${fmt(c.coupler_class)}</span></div>
                        <div class="row"><span class="k">Protocole</span><span class="v">${fmt(c.protocol)}</span></div>
                        <div class="row"><span class="k" data-i18n="coupler.device_state">Device State</span><span class="v">${fmt(c.dev_state)}</span></div>
                        <div class="row"><span class="k" data-i18n="coupler.msg_in_out">Msg in/out</span><span class="v">${fmt(c.msg_in)} / ${fmt(c.msg_out)}</span></div>
                        <div class="row"><span class="k" data-i18n="coupler.rate_in_out">Rate in/out</span><span class="v">${fmt(c.input_rate && c.input_rate.toFixed(1))} / ${fmt(c.output_rate && c.output_rate.toFixed(1))} /s</span></div>
                        ${c.error ? `<div class="row"><span class="k">Erreur</span><span class="v" style="color:var(--red)">${fmt(c.error)}</span></div>` : ""}
                        ${c.status ? `<div class="row"><span class="k">Statut</span><span class="v">${fmt(c.status)}</span></div>` : ""}
                        <div class="row"><span class="k" data-i18n="coupler.trace">Trace</span><span class="v" style="color:${c.trace_on ? 'var(--green)' : 'var(--muted)'}" data-i18n-text="${c.trace_on ? 'coupler.activated' : 'coupler.inactive'}">${c.trace_on ? 'activated' : 'inactive'}</span></div>
                        <div class="card-actions">${startStopBtn}${suspendResumeBtn}${traceBtn}</div>
                    </div>
                `;
            }).join("");

            body.innerHTML = `
                <div class="console-section">
                    <h3 data-i18n="console.servers">TCP/UDP Servers</h3> (${(d.servers||[]).length})
                    ${servers || '<div class="empty" data-i18n="console.no_servers">No servers.</div>'}
                </div>
                <div class="console-section">
                    <h3 data-i18n="console.couplers">Couplers</h3> (${(d.couplers||[]).length})
                    <div class="grid">${couplers || '<div class="empty" data-i18n="console.no_couplers">No couplers.</div>'}</div>
                </div>
            `;
            t.translateAllElements();
        }

        async function couplerCmd(process, coupler, cmd) {
            try {
                const r = await apiPost("/api/coupler", { process, coupler, cmd });
                toast(`${cmd} ${coupler}: ${r.ok ? "OK" : (r.error || t.t("toast.failure"))}`, r.ok);
                if (r.ok) {
                    const win = focusWindow('console', process);
                    if (win) setTimeout(() => refreshConsole(win), 800);
                }
            } catch (e) {
                toast(t.t("toast.error", {error: e.message}), false);
            }
        }

        function closeConsole(processName) {
            closeWindow(windowKey('console', processName));
        }

        function toggleAuto() {
            autoEnabled = $("auto-refresh").checked;
            if (autoEnabled) {
                scheduleNext();
            } else if (autoTimer) {
                clearTimeout(autoTimer);
                autoTimer = null;
            }
        }

        async function systemCmdConfirm(cmd) {
            const labels = {halt: t.t("command.halt_confirm"), reboot: t.t("command.reboot_confirm"),
                            navigation_restart: t.t("command.navigation_restart_confirm")};
            if (!confirm(`Confirmer : ${labels[cmd] || cmd} ?`)) return;
            try {
                const r = await apiPost("/api/system", { cmd });
                toast(`${cmd}: ${r.ok ? "OK" : (r.error || t.t("toast.failure"))}`, r.ok);
                if (r.ok) setTimeout(refresh, 1500);
            } catch (e) {
                toast(t.t("toast.error", {error: e.message}), false);

        let logProcess = null;
        let logEventSource = null;

        function openLog(processName) {
            logProcess = processName;
            $("log-title").textContent = `Logs — ${processName}`;
            $("log-body").textContent = "";
            $("log-modal").classList.add("show");
            // Auto-start the stream
            startLogStream();
        }

        function startLogStream() {
            if (!logProcess) return;
            if (logEventSource) {
                logEventSource.close();
                logEventSource = null;
            }
            $("log-body").textContent = "";
            $("log-start-btn").disabled = true;
            $("log-stop-btn").disabled = false;
            logEventSource = new EventSource(`/api/log/stream/${encodeURIComponent(logProcess)}`);
            logEventSource.addEventListener("started", () => {
                appendLogLine(t.t("console.stream_started"));
            });
            logEventSource.addEventListener("error", (e) => {
                if (e.data) appendLogLine("ERREUR: " + e.data);
                stopLogStream();
            });
            logEventSource.onmessage = (e) => {
                appendLogLine(e.data);
            };
        }

        async function stopLogStream() {
            if (logEventSource) {
                logEventSource.close();
                logEventSource = null;
            }
            $("log-start-btn").disabled = false;
            $("log-stop-btn").disabled = true;
            appendLogLine(t.t("console.stream_stopped"));
            try {
                await apiPost("/api/log/stop", {});
            } catch (e) { /* ignore */ }
        }

        function appendLogLine(line) {
            const body = $("log-body");
            body.textContent += line + "\n";
            body.scrollTop = body.scrollHeight;
        }

        function closeLog() {
            stopLogStream();
            $("log-modal").classList.remove("show");
            logProcess = null;
        }

        async function openNetwork() {
            $("network-modal").classList.add("show");
            $("network-body").innerHTML = `<div class="empty">${t.t("general.loading")}</div>`;
            try {
                const [status, configs, connections] = await Promise.all([
                    apiGet("/api/network"),
                    apiGet("/api/network/configs"),
                    apiGet("/api/network/connections"),
                ]);
                renderNetwork(status, configs, connections);
            } catch (e) {
                $("network-body").innerHTML = `<div class="empty">Erreur: ${escapeHtml(e.message)}</div>`;
            }
        }

        function renderNetwork(status, configs, connections) {
            const body = $("network-body");
            if (!status.ok) {
                body.innerHTML = `<div class="empty">${escapeHtml(status.error || "Erreur")}</div>`;
                t.translateAllElements();
                return;
            }
            const connectionOptions = (connections.ok ? (connections.connections || []) : [])
                .map(c => `<option value="${escapeHtml(c.name)}">${escapeHtml(c.name)}</option>`).join("");
            
            const interfaces = (status.interfaces || []).map(iface => {
                const hasConnection = iface.connection_name && iface.connection_name !== "";
                const upDisabled = !hasConnection ? 'disabled' : '';
                const downDisabled = !hasConnection ? 'disabled' : '';
                const deleteDisabled = !hasConnection ? 'disabled' : '';
                return `
                <div class="net-interface">
                    <strong>${escapeHtml(iface.name)}</strong>
                    · ${escapeHtml(iface.type)}
                    · ${escapeHtml(iface.state)}
                    ${iface.function ? `· ${escapeHtml(iface.function)}` : ""}
                    ${iface.device_name ? `· ${escapeHtml(iface.device_name)}` : ""}
                    ${iface.connection_name ? `<br><span style="color:var(--muted)">Connexion: ${escapeHtml(iface.connection_name)}</span>` : ""}
                    <div class="card-actions">
                        <button ${upDisabled} onclick="networkInterfaceCmd('${escapeHtml(iface.name)}', '', 'up')" title="Up connection">↑ Up</button>
                        <button ${downDisabled} onclick="networkInterfaceCmd('${escapeHtml(iface.name)}', '', 'down')" title="Down connection">↓ Down</button>
                        <button ${deleteDisabled} onclick="networkInterfaceCmd('${escapeHtml(iface.name)}', '', 'del_connection')" title="Delete connection">✕ Delete</button>
                        <select class="net-config-select" id="conn-select-${escapeHtml(iface.name)}">
                            <option value="" data-i18n="network.select_connection">Select connection...</option>
                            ${connectionOptions}
                        </select>
                        <button onclick="addConnection('${escapeHtml(iface.name)}')" title="Add connection">➕ Add</button>
                    </div>
                </div>
            `;}).join("");

            const configOptions = (configs.ok ? (configs.configurations || []) : [])
                .map(c => `<option value="${escapeHtml(c)}">${escapeHtml(c)}</option>`).join("");

            body.innerHTML = `
                <div class="console-section">
                    <h3>NetworkManager: ${status.nm_running ? 'actif' : 'inactif'} ${status.status ? '· ' + escapeHtml(status.status) : ''}</h3>
                    ${interfaces || '<div class="empty" data-i18n="network.no_interfaces">No interfaces.</div>'}
                </div>
                <div class="console-section">
                    <h3 data-i18n="network.global_configs">Global Configurations</h3>
                    <div class="card-actions">
                        <select id="net-config-select" class="net-config-select">${configOptions}</select>
                        <button onclick="applyNetworkConfig()">Appliquer</button>
                    </div>
                </div>
            `;
            t.translateAllElements();
        }

            try {

            } catch (e) {
                toast(t.t("toast.error", {error: e.message}), false);

        // --- NMEA2000 view ----------------------------------------------------
        // Single NMEA2000 window per process. The device (PGN stats) view is an
        // in-place navigation within the same window; while in device view the
        // list auto-refresh is paused and resumes when returning to the list.
        function stopNmea2000Refresh(win) {
            if (win && win.refreshTimer) {
                clearTimeout(win.refreshTimer);
                win.refreshTimer = null;
            }
        }

        async function openNmea2000(processName) {
            const win = createWindow('nmea2000', processName, "NMEA2000 — " + processName, (w) => {
                stopNmea2000Refresh(w);
            });
            win.processName = processName;
            win.inDeviceView = false;
            win.headerTitle.textContent = "NMEA2000 — " + processName;
            win.body.innerHTML = `<div class="empty">${t.t("general.loading")}</div>`;
            await refreshNmea2000(win);
        }

        async function refreshNmea2000(win) {
            if (!win || activeWindows.get(windowKey('nmea2000', win.processName)) !== win) return;
            if (win.inDeviceView) {
                win.refreshTimer = setTimeout(() => refreshNmea2000(win), REFRESH_INTERVAL);
                return;
            }
            const processName = win.processName;
            try {
                const data = await apiGet("/api/nmea2000/" + encodeURIComponent(processName) + "/status");
                if (activeWindows.get(windowKey('nmea2000', processName)) === win && !win.inDeviceView) {
                    renderNmea2000(data, processName, win);
                    win.refreshTimer = setTimeout(() => refreshNmea2000(win), REFRESH_INTERVAL);
                }
            } catch (e) {
                console.error("NMEA2000 refresh error:", e);
                win.refreshTimer = setTimeout(() => refreshNmea2000(win), REFRESH_INTERVAL);
            }
        }

        function closeNmea2000(processName) {
            closeWindow(windowKey('nmea2000', processName));
        }

        function renderNmea2000(data, processName, win) {
            const body = win.body;
            if (!data.ok) {
                body.innerHTML = `<div class="empty">${escapeHtml(data.error || "NMEA2000 Error")}</div>`;
                t.translateAllElements();
                return;
            }
            const devices = data.devices || [];
            const traceBtnText = data.traces_on ? "■ Stop Trace" : "▶ Start Trace";
            const traceBtnCmd = data.traces_on ? "stop_trace" : "start_trace";
            const incomingRate = data.incoming_rate ? data.incoming_rate.toFixed(1) : "0";
            const outgoingRate = data.outgoing_rate ? data.outgoing_rate.toFixed(1) : "0";
            let html = `<div class="console-section">
                <h3>NMEA2000 Controller</h3>
                <div class="row">
                    <span class="k">Channel</span><span class="v">${fmt(data.channel)}</span>
                    <span class="k">Status</span><span class="v">${fmt(data.status)}</span>
                </div>
                <div class="row">
                    <span class="k">Incoming</span><span class="v">${incomingRate} msg/s</span>
                    <span class="k">Outgoing</span><span class="v">${outgoingRate} msg/s</span>
                </div>
                <div class="card-actions">
                    <button onclick="nmea2000TraceCmd('${escapeHtml(processName)}', '${traceBtnCmd}')">${traceBtnText}</button>
                </div>
            </div>
            <div class="console-section">
                <h3>Devices (${devices.length})</h3>
                <div class="nmea2000-devices">`;
            if (devices.length === 0) {
                html += '<div class="empty" data-i18n="nmea2000.no_devices">No NMEA2000 devices.</div>';
            } else {
                for (const dev of devices) {
                    const proxySymbol = dev.is_proxy ? '<span class="proxy-symbol" title="Proxy"></span>' : '';
                    html += `<div class="nmea2000-device">
                        <span class="dev-addr">${dev.address}</span>
                        ${proxySymbol}
                        <span class="dev-mfg">${fmt(dev.manufacturer_name)}</span>
                        <span class="dev-prod">${fmt(dev.product_name)}</span>
                        <button class="open-btn compact" onclick="openNmea2000Device('${escapeHtml(processName)}', ${dev.address})">PGN Stats</button>
                    </div>`;
                }
            }
            html += '</div></div>';
            body.innerHTML = html;
        }

        async function openNmea2000Device(processName, deviceAddress) {
            const win = focusWindow('nmea2000', processName);
            if (!win) return;
            win.inDeviceView = true;
            win.headerTitle.textContent = "NMEA2000 — " + processName + " — Device " + deviceAddress;
            win.body.innerHTML = `<div class="empty">${t.t("general.loading")}</div>`;
            try {
                const data = await apiGet("/api/nmea2000/" + encodeURIComponent(processName) + "/device/" + deviceAddress);
                if (data.ok) {
                    renderNmea2000Device(data, processName, deviceAddress, win);
                } else {
                    toast(data.error || "Erreur", false);
                }
            } catch (e) {
                toast(t.t("toast.error", {error: e.message}), false);
            }
        }

        async function renderNmea2000Device(data, processName, deviceAddress, win) {
            const title = win.headerTitle;
            title.textContent = "NMEA2000 — " + processName + " — Device " + deviceAddress;
            const body = win.body;
            let html = `<div class="console-section">
                <h3>NMEA2000 Device</h3>
                <div class="row">
                    <span class="k">Address</span><span class="v">${data.address}</span>
                    <span class="k">Proxy</span><span class="v">${data.is_proxy ? 'Yes' : 'No'}</span>
                </div>
                <div class="row">
                    <span class="k">Manufacturer</span><span class="v">${fmt(data.manufacturer_name)}</span>
                    <span class="k">Product</span><span class="v">${fmt(data.product_name)}</span>
                </div>
            </div>`;
            // Separate stats by direction
            const inStats = (data.pgn_stats || []).filter(s => s.direction === 'in');
            const outStats = (data.pgn_stats || []).filter(s => s.direction === 'out');
            if (inStats.length > 0 || outStats.length > 0) {
                html += '<div class="console-section"><h3>PGN Statistics</h3>';
                if (inStats.length > 0) {
                    html += '<div class="pgn-list"><h4>Incoming</h4><div class="pgn-items">';
                    for (const stat of inStats) {
                        const pgnDef = await getPgnDefinitionCached(processName, stat.pgn);
                        html += `<div class="pgn-item"><span class="pgn-num">${stat.pgn}</span><span class="pgn-desc">${pgnDef || ''}</span><span class="pgn-count">${stat.count}</span></div>`;
                    }
                    html += '</div></div>';
                }
                if (outStats.length > 0) {
                    html += '<div class="pgn-list"><h4>Outgoing</h4><div class="pgn-items">';
                    for (const stat of outStats) {
                        const pgnDef = await getPgnDefinitionCached(processName, stat.pgn);
                        html += `<div class="pgn-item"><span class="pgn-num">${stat.pgn}</span><span class="pgn-desc">${pgnDef || ''}</span><span class="pgn-count">${stat.count}</span></div>`;
                    }
                    html += '</div></div>';
                }
                html += '</div>';
            }
            html += `<div class="card-actions"><button class="open-btn" onclick="backToNmea2000List('${escapeHtml(processName)}')">Back</button></div>`;
            body.innerHTML = html;

            t.translateAllElements();}

        // Simple cache for PGN definitions
        const pgnDefCache = new Map();
        async function getPgnDefinitionCached(processName, pgn) {
            const cacheKey = processName + ":" + pgn;
            if (pgnDefCache.has(cacheKey)) {
                return pgnDefCache.get(cacheKey);
            }
            try {
                const data = await apiGet("/api/nmea2000/" + encodeURIComponent(processName) + "/device/" + pgn + "/pgn");
                if (data.ok && data.definition) {
                    pgnDefCache.set(cacheKey, data.definition);
                    return data.definition;
                }
            } catch (e) {
                // ignore
            }
            return null;
        }

        function backToNmea2000List(processName) {
            const win = focusWindow('nmea2000', processName);
            if (!win) return;
            win.inDeviceView = false;
            win.headerTitle.textContent = "NMEA2000 — " + processName;
            refreshNmea2000(win);
        }

        async function nmea2000TraceCmd(processName, cmd) {
            try {
                const r = await apiPost("/api/nmea2000/" + encodeURIComponent(processName) + "/trace", { cmd: cmd });
                toast(cmd + ": " + (r.ok ? "OK" : (r.error || t.t("toast.failure"))), r.ok);
                if (r.ok) {
                    const win = focusWindow('nmea2000', processName);
                    if (win && !win.inDeviceView) setTimeout(() => refreshNmea2000(win), 800);
                }
            } catch (e) {
                toast(t.t("toast.error", {error: e.message}), false);
            }
        }


        // --- Engine Dashboard ----------------------------------------------------
        // Single Engine window per process; refresh interval and the
        // runs/events mode are kept on the window record.
        function stopEngineRefresh(win) {
            if (win && win.refreshTimer) {
                clearTimeout(win.refreshTimer);
                win.refreshTimer = null;
            }
        }

        async function openEngineData(processName) {
            const win = createWindow('engine', processName, t.t("engine.title") || "Engine Data", (w) => {
                stopEngineRefresh(w);
            });
            win.processName = processName;
            win.eventsMode = 'runs';
            win.headerTitle.textContent = "";
            win.body.innerHTML = `<div class="empty">${t.t("general.loading")}</div>`;
            try {
                const data = await apiGet(`/api/engines`);
                renderEngineDashboard(data, processName, win);
                startEngineRefresh(win);
                await setEngineEventsMode(processName, 'runs');
            } catch (e) {
                win.body.innerHTML = `<div class="empty">${escapeHtml(e.message)}</div>`;
            }
        }

        function startEngineRefresh(win) {
            if (win.refreshTimer) {
                clearTimeout(win.refreshTimer);
                win.refreshTimer = null;
            }
            const processName = win.processName;
            async function doRefresh() {
                if (activeWindows.get(windowKey('engine', processName)) !== win) return;
                let data = null;
                let engine = null;
                try {
                    data = await apiGet(`/api/engines`);
                    if (data && data.ok) {
                        const engines = data.engines || [];
                        engine = engines.find(e => e.process === processName);
                        if (engine) {
                            // Preserve the events section across the dashboard refresh so
                            // it is not wiped/flashed on every refresh tick.
                            const evContainer = $(`engine-events-${processName}`);
                            const savedEventsHtml = evContainer ? evContainer.innerHTML : null;
                            const savedMode = win.eventsMode || 'runs';
                            renderEngineDashboard(data, processName, win);
                            win.eventsMode = savedMode;
                            if (savedEventsHtml !== null) {
                                const restored = $(`engine-events-${processName}`);
                                if (restored) restored.innerHTML = savedEventsHtml;
                            }
                        }
                    }
                } catch (e) {
                    console.error("Engine refresh error:", e);
                }
                const delay = (engine && engine.state === "ENGINE_RUNNING") ? 1000 : REFRESH_INTERVAL;
                win.refreshTimer = setTimeout(doRefresh, delay);
            }
            doRefresh();
        }

        function renderEngineDashboard(data, processName, win) {
            const body = win.body;
            if (!data.ok) {
                body.innerHTML = `<div class="empty">${escapeHtml(data.error || "Error")}</div>`;
                t.translateAllElements();
                return;
            }
            const engines = data.engines || [];
            if (engines.length === 0) {
                body.innerHTML = '<div class="empty" data-i18n="engine.no_engines">No engines found.</div>';
                t.translateAllElements();
                return;
            }
            const engine = engines.find(e => e.process === processName);
            if (!engine) {
                body.innerHTML = '<div class="empty" data-i18n="engine.no_engines">No engines found.</div>';
                t.translateAllElements();
                return;
            }
            const params = engine.parameters || {};
            win.headerTitle.textContent = `${escapeHtml(engine.label)} ${escapeHtml(engine.model)}`;
            const isRunning = engine.state === "ENGINE_RUNNING";
            const isOff = engine.state === "ENGINE_OFF";
            const speedPercent = isOff ? 0 : Math.min((engine.speed / (params.max_rpm || 1)) * 100, 100);
            const voltagePercent = isOff ? 0 : Math.min((engine.alternator_voltage / (params.voltage_scale || 1)) * 100, 100);
            const tempPercent = isOff ? 0 : Math.min((engine.temperature / (params.temperature_scale || 1)) * 100, 100);
            const voltageColor = isOff ? "var(--muted)" : (engine.alternator_voltage >= params.voltage_high_alert || engine.alternator_voltage <= params.voltage_low_alert ? "var(--red)" : "var(--green)");
            const tempColor = isOff ? "var(--muted)" : (engine.temperature >= params.temperature_high_alert ? "var(--red)" : "var(--green)");
            const stateSymbol = isRunning ? "▶️" : isOff ? "■" : "◆";
            const val = (v) => isOff ? "--" : fmt(v);
            // Tachometer: 270-degree arc from 7 o'clock (RPM=0) to 5 o'clock (100%),
            // with the bottom 90-degree gap neutralised in a distinct color. The green
            // arc represents the actual speed.
            const R = 45, C = 2 * Math.PI * R;        // circumference
            const ARC = C * (270 / 360);             // active 270deg arc length
            const GAP = C - ARC;                     // neutralised bottom gap
            const FILL = ARC * (speedPercent / 100);// green fill portion of the arc
            body.innerHTML = `
                <div class="engine-dashboard">
                    <div class="dashboard-row">
                        <div class="gauge-container">
                            <div class="gauge">
                                <svg viewBox="0 0 100 100" class="gauge-svg">
                                    <circle cx="50" cy="50" r="${R}" fill="none" stroke="var(--panel-2)" stroke-width="8" stroke-dasharray="${GAP} ${ARC}" transform="rotate(45 50 50)" />
                                    <circle cx="50" cy="50" r="${R}" fill="none" stroke="var(--border)" stroke-width="8" stroke-dasharray="${ARC} ${GAP}" transform="rotate(135 50 50)" />
                                    <circle cx="50" cy="50" r="${R}" fill="none" stroke="var(--green)" stroke-width="8" stroke-dasharray="${FILL} ${C}" transform="rotate(135 50 50)" />
                                    <text x="50" y="62" text-anchor="middle" font-size="15" fill="var(--text)">${val(engine.speed)}</text>
                                    <text x="50" y="78" text-anchor="middle" font-size="10" fill="var(--muted)">RPM</text>
                                </svg>
                            </div>
                        </div>
                        <div class="status-display">
                            <div class="status-icon" style="font-size: 3rem;">${stateSymbol}</div>
                            <div class="status-text">
                                <span class="badge ${engine.state}" data-i18n="engine.state_${engine.state.toLowerCase()}">${engine.state}</span>
                            </div>
                        </div>
                    </div>
                    <div class="dashboard-row">
                        <div class="bar-graph">
                            <div class="bar-label" data-i18n="engine.voltage">Voltage</div>
                            <div class="bar-container">
                                <div class="bar-fill" style="height: ${voltagePercent}%; background: ${voltageColor};"></div>
                            </div>
                            <div class="bar-value">${val(engine.alternator_voltage)} V</div>
                        </div>
                        <div class="bar-graph">
                            <div class="bar-label" data-i18n="engine.temperature">Temperature</div>
                            <div class="bar-container">
                                <div class="bar-fill" style="height: ${tempPercent}%; background: ${tempColor};"></div>
                            </div>
                            <div class="bar-value">${val(engine.temperature)} °C</div>
                        </div>
                        <div class="stats-box">
                            <div class="stat-row">
                                <span class="stat-label" data-i18n="engine.total_hours">Total Hours</span>
                                <span class="stat-value">${fmt(engine.total_hours)} h</span>
                            </div>
                            <div class="stat-row">
                                <span class="stat-label" data-i18n="engine.last_start">Last Start</span>
                                <span class="stat-value">${engine.last_start_time ? new Date(engine.last_start_time).toLocaleString() : "N/A"}</span>
                            </div>
                            <div class="stat-row">
                                <span class="stat-label" data-i18n="engine.last_stop">Last Stop</span>
                                <span class="stat-value">${engine.last_stop_time ? new Date(engine.last_stop_time).toLocaleString() : "N/A"}</span>
                            </div>
                        </div>
                    </div>
                    <div class="events-section">
                        <h3 style="display:flex; align-items:center; gap:12px;">
                            <span data-i18n="engine.history">History</span>
                            <div class="events-toggle ${win.eventsMode === 'events' ? 'mode-events' : ''}" id="engine-toggle-${escapeHtml(processName)}">
                                <span class="events-toggle-thumb"></span>
                                <input type="radio" name="events-mode-${escapeHtml(processName)}" id="events-runs-${escapeHtml(processName)}" ${win.eventsMode === 'runs' ? 'checked' : ''}>
                                <label for="events-runs-${escapeHtml(processName)}" data-i18n="engine.show_runs">Runs</label>
                                <input type="radio" name="events-mode-${escapeHtml(processName)}" id="events-events-${escapeHtml(processName)}" ${win.eventsMode === 'events' ? 'checked' : ''}>
                                <label for="events-events-${escapeHtml(processName)}" data-i18n="engine.show_events">Events</label>
                            </div>
                        </h3>
                        <div id="engine-events-${escapeHtml(processName)}" class="engine-events-list" data-process="${processName}" data-mode="${win.eventsMode || 'runs'}"><div class="empty" data-i18n="general.loading">Loading...</div></div>
                    </div>
                    <div class="card-actions">
                        <button class="open-btn" onclick="closeEngine('${escapeHtml(processName)}')" data-i18n="general.close">Close</button>
                    </div>
                </div>
            `;
            t.translateAllElements();
            const rRuns = $(`events-runs-${processName}`);
            const rEvents = $(`events-events-${processName}`);
            if (rRuns) rRuns.addEventListener('change', () => setEngineEventsMode(processName, 'runs'));
            if (rEvents) rEvents.addEventListener('change', () => setEngineEventsMode(processName, 'events'));
        }

        async function setEngineEventsMode(processName, mode) {
            const win = focusWindow('engine', processName);
            if (!win) return;
            win.eventsMode = mode;
            const toggleEl = $(`engine-toggle-${processName}`);
            if (toggleEl) toggleEl.classList.toggle('mode-events', mode === 'events');
            const container = $(`engine-events-${processName}`);
            if (container) {
                container.setAttribute('data-mode', mode);
                container.innerHTML = `<div class="empty" data-i18n="general.loading">Loading...</div>`;
                t.translateAllElements();
            }
            const data = await apiGet(`/api/engine/0`);
            if (data.ok) {
                renderEngineEvents(data, processName, mode);
            }
        }

        function renderEngineEvents(data, processName, mode) {
            const container = $(`engine-events-${processName}`);
            if (!container) return;
            if (!data.ok) {
                container.innerHTML = `<div class="empty">${escapeHtml(data.error || "Error")}</div>`;
                t.translateAllElements();
                return;
            }
            let html = '';
            if (mode === 'runs') {
                const runs = data.runs || [];
                if (runs.length === 0) {
                    container.innerHTML = '<div class="empty" data-i18n="engine.no_runs">No runs found.</div>';
                    t.translateAllElements();
                    return;
                }
                const runRows = runs.map(run => `
                    <div class="run-row">
                        <span class="run-date">${new Date(run.start_time).toLocaleString()}</span>
                        <span class="run-date">${run.stop_time ? new Date(run.stop_time).toLocaleString() : "N/A"}</span>
                    <span class="run-duration">${fmt(run.duration / 60)}</span>
                        <span class="run-avg">${fmt(run.average_speed)} RPM</span>
                        <span class="run-max">${fmt(run.max_speed)} RPM</span>
                    </div>
                `).join("");
                html = `
                    <div class="runs-list">
                        <div class="run-header">
                            <span class="run-date" data-i18n="engine.start_time">Start Time</span>
                            <span class="run-date" data-i18n="engine.stop_time">Stop Time</span>
                            <span class="run-duration" data-i18n="engine.duration_min">Duration (min)</span>
                            <span class="run-avg" data-i18n="engine.avg_speed">Avg Speed</span>
                            <span class="run-max" data-i18n="engine.max_speed">Max Speed</span>
                        </div>
                        ${runRows}
                    </div>
                `;
            } else {
                const events = data.events || [];
                if (events.length === 0) {
                    container.innerHTML = '<div class="empty" data-i18n="engine.no_events">No events found.</div>';
                    t.translateAllElements();
                    return;
                }
                const eventRows = events.map(evt => `
                    <div class="event-row">
                        <span class="event-time">${new Date(evt.timestamp).toLocaleString()}</span>
                        <span class="event-hours">${fmt(evt.total_hours)} h</span>
                        <span class="event-from" data-i18n="engine.from_state">From: ${evt.previous_state}</span>
                        <span class="event-to" data-i18n="engine.to_state">To: ${evt.current_state}</span>
                    </div>
                `).join("");
                html = `
                    <div class="events-list">
                        <div class="event-header">
                            <span class="event-time" data-i18n="engine.time">Time</span>
                            <span class="event-hours" data-i18n="engine.total_hours">Total Hours</span>
                            <span class="event-from" data-i18n="engine.from_state">From</span>
                            <span class="event-to" data-i18n="engine.to_state">To</span>
                        </div>
                        ${eventRows}
                    </div>
                `;
            }
            container.innerHTML = html;
            t.translateAllElements();
        }

        function closeEngine(processName) {
            closeWindow(windowKey('engine', processName));
        }

        window.procCmd = procCmd;
        window.systemCmd = systemCmd;
        window.systemCmdConfirm = systemCmdConfirm;
        window.openLog = openLog;
        window.startLogStream = startLogStream;
        window.stopLogStream = stopLogStream;
        window.closeLog = closeLog;
        window.openNetwork = openNetwork;
        window.closeNetwork = closeNetwork;
        window.openNmea2000 = openNmea2000;
        window.closeNmea2000 = closeNmea2000;
        window.nmea2000TraceCmd = nmea2000TraceCmd;
        window.openNmea2000Device = openNmea2000Device;
        window.backToNmea2000List = backToNmea2000List;
        window.applyNetworkConfig = applyNetworkConfig;
        window.openConsole = openConsole;
        window.closeConsole = closeConsole;
        window.couplerCmd = couplerCmd;


        window.networkInterfaceCmd = networkInterfaceCmd;
        window.addConnection = addConnection;
        window.showAddConnection = showAddConnection;

        window.openEngineData = openEngineData;
        window.closeEngine = closeEngine;
        window.setEngineEventsMode = setEngineEventsMode;
        $("refresh-btn").addEventListener("click", refresh);
        $("auto-refresh").addEventListener("change", toggleAuto);
        refresh();

    
    // Function to translate all data-i18n elements on the page
    function translateAllElements() {
        const elements = document.querySelectorAll('[data-i18n]');
        elements.forEach(el => {
            const key = el.getAttribute('data-i18n');
            if (key) {
                el.textContent = t.t(key);
            }
        });
    }
    
    // Call translation on page load and language change
    async function initPageTranslations() {
        await initWebTranslations();
        translateAllElements();
        // Also re-translate when language changes (if needed)
    }
    
    // Initialize on DOM load
    document.addEventListener('DOMContentLoaded', initPageTranslations);
    </script>

</body>
</html>
