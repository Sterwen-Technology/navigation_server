<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Energy Simulator</title>
    <link rel="stylesheet" href="energy_simulator.css">
</head>
<body>
    <header>
        <h1>Energy Simulator</h1>
        <p class="subtitle">Simulate boat energy system with manual parameter control</p>
    </header>

    <div class="container">
        <!-- System Status -->
        <div class="system-panel">
            <h2>System Status</h2>
            <div class="main-controls">
                <button class="btn btn-success" id="startBtn" onclick="startSimulation()">
                    <span class="status-indicator" id="statusIndicator"></span>
                    <span id="startBtnText">Start Simulation</span>
                </button>
                <button class="btn btn-danger" id="stopBtn" onclick="stopSimulation()">Stop Simulation</button>
                <div class="cycle-period-control">
                    <label for="cyclePeriod">Cycle Period (s):</label>
                    <input type="number" id="cyclePeriod" min="1" max="10" step="0.1" value="2.0">
                    <button class="btn btn-primary" onclick="setCyclePeriod()">Set</button>
                </div>
            </div>
            
            <div class="error-message" id="errorMessage"></div>
            
            <div class="value-display" id="systemValues">
                <div class="value-card">
                    <div class="label">System Voltage</div>
                    <div class="value"><span id="systemVoltage">0.0</span><span class="unit">V</span></div>
                </div>
                <div class="value-card">
                    <div class="label">Consumption</div>
                    <div class="value"><span id="consumptionPower">0.0</span><span class="unit">W</span></div>
                </div>
                <div class="value-card">
                    <div class="label">Battery SoC</div>
                    <div class="value"><span id="batterySoc">0.0</span><span class="unit">%</span></div>
                </div>
                <div class="value-card">
                    <div class="label">Battery Voltage</div>
                    <div class="value"><span id="batteryVoltage">0.0</span><span class="unit">V</span></div>
                </div>
            </div>
        </div>

        <!-- Configuration will be loaded dynamically from status API -->
        <div id="configSections"></div>
    </div>

    <script src="energy_simulator.js"></script>
</body>
</html>
